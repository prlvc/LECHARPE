function computeElection(tour){
  const m=mods(),st=S.st,dist=Math.abs(POSVAL[S.maire.pos]-S.ville.lean);
  let sc=25+(st.p-50)*0.75+(st.c-50)*0.1+(st.a-50)*0.1+(st.r-50)*0.05+m.elec+2-dist*2.2;
  (S.programme||[]).forEach(k=>{const g=ENGAGEMENTS.find(x=>x.k===k);if(S.ville.attentes.includes(g.prio))sc+=1.6;if(S.maire.prios.includes(g.prio))sc+=0.4;});
  sc+=Math.min(S.mandatInaug,6)*0.5+S.campBonus+R(-4,4);
  sc=clamp(sc,10,78);
  const nL=S.ville.pop<1000?2:S.ville.pop<20000?3:4;
  const others=[];let rest=100-sc;
  for(let i=1;i<nL;i++){const share=i===nL-1?rest:rest*R(0.5,0.7);others.push(share);rest-=share;}
  const shares=[sc,...others];
  const names=[`${S.maire.prenom} ${S.maire.nom}`,`${S.oppName.prenom} ${S.oppName.nom}`];
  for(let i=2;i<nL;i++){const n=personName(pick(['f','m']));names.push(n.prenom+' '+n.nom);}
  const lists=shares.map((s,i)=>({tete:names[i],s,nom:i===0?S.listeNom:pick(['Agir pour ','Ensemble pour ','Un nouveau souffle pour ','Fiers de '])+S.ville.nom}));
  const r={part:R(46,68),t1:lists.map(l=>({...l}))};
  const win1=shares.indexOf(Math.max(...shares));
  if(Math.max(...shares)>50){r.tour=1;r.winner=win1;}
  else{r.tour=2;const t2=lists.filter((l,i)=>l.s>=10||i<2).map(l=>({...l}));
    // fusions : les listes < 10 % reportent leurs voix
    const lost=lists.filter((l,i)=>!(l.s>=10||i<2)).reduce((s,l)=>s+l.s,0);
    t2.forEach((l,i)=>{l.s+=lost/t2.length;});
    const swing=R(-3,3)+(S.campBonus*0.5);t2[0].s+=swing;t2[1].s-=swing;
    if(t2.length>2){const third=t2[2].s*R(0.3,0.6);t2[2].s-=third;t2[0].s+=third*R(0.3,0.6);t2[1].s+=third*0.5;}
    const tot=t2.reduce((s,l)=>s+l.s,0);t2.forEach(l=>l.s=l.s*100/tot);
    r.t2=t2;r.part2=r.part+R(-4,5);r.winner=t2.indexOf(t2.reduce((a,b)=>a.s>b.s?a:b));}
  const fin=r.t2||r.t1;r.seats=seatsAlloc(conseilN(S.ville.pop),fin.map(l=>l.s),r.winner);r.won=r.winner===0;
  return r;
}

    if(typeof toast==='function'&&typeof document!=='undefined')toast(`Niveau ${C.lvl} : deux points d’attribut à répartir`);
    const A=adviser();if(A.p&&A.k!=='adj')chatPush(A.k,pick([`Tu prends de l’épaisseur, ça se voit. Passe par l’onglet Carrière.`,`On sent que tu as appris le métier. Il y a des choses à travailler, regarde ta fiche.`]));}
}
function attrUp(k,v){S.car.attr[k]=clamp(S.car.attr[k]+v,0,99);}
function attrUse(k,v){const a=S.car.attr[k];attrUp(k,v*clamp((85-a)/45,0,1));}
function checkAch(){
  const C=S.car;for(const [k,[n,,chk]] of Object.entries(ACH)){if(C.ach[k]!==undefined)continue;let ok=false;try{ok=chk();}catch(e){}
    if(ok){C.ach[k]=S.day;C.rep=clamp(C.rep+1.5);albumAdd('Succès : '+n,'fete','succes');gainXP(25);if(typeof document!=='undefined')toast('Succès débloqué : '+n);}}
  const objs=[C.obj,...C.objSec].filter(Boolean);
  objs.forEach(k=>{if(C.objDone[k]!==undefined)return;let ok=false;try{ok=OBJS[k].chk();}catch(e){}
    if(ok){C.objDone[k]=S.day;const main=k===C.obj;gainXP(main?200:80);C.rep=clamp(C.rep+(main?6:2));albumAdd('Objectif atteint : '+OBJS[k].n,'inaug','objectif');
      info('Cabinet','Objectif atteint',`« ${OBJS[k].n} » : c’est fait. ${main?'C’était l’ambition de votre mandat. Elle est tenue.':'Un objectif secondaire de plus.'}`);}});
}

/* ----- Événements nouveaux : métier, santé, vie privée, voisins, habitants, opposition ----- */
Object.assign(EV,{
 arret:{l:'bureau',t:'Votre médecin vous arrête',x:`Tension trop haute, sommeil en miettes. Votre médecin traitant signe un arrêt de deux semaines et vous regarde par-dessus ses lunettes : « Je ne plaisante pas. »`,ch:[
  {l:`Obéir, et confier l’intérim à {adj}`,e:{p:-0.5,sr:-30},f:()=>{S.car.sante=Math.max(S.car.sante,62);S.car.arret=S.day+14;S.creneaux=0;S.energie=Math.max(S.energie,70);return {r:`Deux semaines loin de la mairie. {adj} tient la boutique. Vous dormez neuf heures par nuit, puis dix.`};}},
  {l:`Continuer malgré l’avis médical`,e:{sr:8},f:()=>{S.car.sante=clamp(S.car.sante+4);if(Math.random()<0.6)S.later.push({ev:'malaise',day:S.day+RI(10,30)});return {r:`Vous rangez l’ordonnance dans un tiroir. Personne n’en saura rien, pour l’instant.`};}}]},
 malaise:{l:'conseil',t:'Malaise en pleine séance',x:`Au milieu du débat sur les tarifs de la cantine, la salle se met à tourner. Vous vous asseyez, puis plus rien. Les pompiers arrivent en six minutes.`,ch:[
  {l:`Accepter trois semaines de repos complet`,e:{p:1.5,e:1,sr:-35},f:()=>{S.car.sante=60;S.car.arret=S.day+21;S.creneaux=0;S.energie=80;return {r:`La ville vous envoie des fleurs, même l’opposition. Vous découvrez que la mairie fonctionne sans vous, ce qui est à la fois rassurant et vexant.`};}}]},
 insomnie:{l:'bureau',t:'Quatre heures du matin',x:`Pour la troisième nuit de suite, vous êtes réveillé{e} à quatre heures, la tête pleine de dossiers. Votre conjoint finit par allumer la lumière.`,ch:[
  {l:`Consulter, et couper le téléphone après 21 heures`,e:{sr:-18,sa:6,en:6},f:()=>{S.creneaux=Math.max(0,S.creneaux-1);return {r:`Le médecin parle de surmenage. Le téléphone dort désormais dans l’entrée. Les nuits reviennent.`};}},
  {l:`Tenir : ça passera après le budget`,e:{sr:6,sa:-5},r:`Café serré, cernes sous le fond de teint pour les photos. Ça tient. Pour combien de temps ?`}]},
 conjoint:{l:'bureau',t:'Un ultimatum à la maison',x:`Un dimanche soir, la conversation que vous repoussiez depuis des mois arrive enfin : « Soit tu reprends ta place ici, soit on en tire les conséquences. »`,ch:[
  {l:`Bloquer deux soirées par semaine, pour de bon`,e:{fa:22,sr:-8},f:()=>{S.creneauxMax=Math.max(3,S.creneauxMax-1);return {r:`Deux soirées sanctuarisées. Le cabinet râle, puis s’adapte. À la maison, on recommence à se parler.`};}},
  {l:`Partir une semaine, loin, sans téléphone`,e:{fa:28,en:20,sr:-15,p:-0.5},r:`Une semaine au bord de l’océan. À votre retour, rien ne s’est effondré, et votre couple va mieux.`},
  {l:`Promettre, encore`,e:{fa:-6,sr:10},r:`La promesse tombe à plat. La porte de la chambre se ferme doucement.`}]},
 enfant:{l:'ecole',t:'Votre enfant pris pour cible',x:`Votre fille rentre du collège en larmes. Depuis la fermeture d’une classe, on lui répète dans la cour que « c’est la faute de sa mère, de son père, du maire ».`,ch:[
  {l:`Voir discrètement la principale`,e:{fa:8,sr:-4},r:`La principale reçoit les élèves concernés. Les moqueries cessent. Votre fille vous serre longtemps dans ses bras.`},
  {l:`En parler publiquement, avec sobriété`,f:()=>skill('elo',0.55)?{r:`Votre message, digne, est partagé dans toute la ville. Plus personne n’ose.`,e:{p:1.5,r:1,fa:4}}:{r:`Le message est mal compris : certains y voient une manœuvre. Votre fille vous en veut d’avoir parlé d’elle.`,e:{fa:-6,r:-1}}},
  {l:`Ne rien dire, laisser passer`,e:{fa:-8,sr:8},r:`Elle ne vous en parle plus. Ce silence vous pèse davantage que les moqueries.`}]},
 anniv:{l:'fete',joy:1,t:'Anniversaire surprise',x:`En rentrant d’une réunion, vous trouvez la salle des mariages plongée dans le noir. Lumière : toute l’équipe, votre famille et un gâteau aux couleurs de {ville}.`,ch:[
  {l:`Souffler les bougies et rester jusqu’au bout`,e:{fa:10,en:8,sr:-12,e:1},r:`Vous restez jusqu’à minuit. Une soirée sans un seul dossier.`}]},
 ambition:{l:'bureau',t:'Votre ambition pour ce mandat',x:`{cab} referme la porte du bureau : « Avant que le quotidien nous avale, dis-moi ce que tu veux avoir accompli dans six ans. Tout le reste en découlera. »`,ch:[]},
 rep2:{l:'salle',t:'L’association des maires vous sollicite',x:`L’association des maires du département {dep} renouvelle son bureau. On vous propose d’y entrer. C’est du temps en moins, et des portes en plus.`,ch:[
  {l:`Accepter`,e:{rep:4,rf:4,en:-4},f:()=>{attrUp('reseau',5);S.car.flags.amd=1;return {r:`Vous voilà membre du bureau. Les maires du département connaissent désormais votre visage, et la préfecture aussi.`};}},
  {l:`Décliner poliment : {ville} d’abord`,e:{p:0.5},r:`Vous restez concentré{e} sur votre commune. Certains y voient de la modestie, d’autres un manque d’appétit.`}]},
 rep3:{l:'presse',t:'Invitation sur un plateau régional',x:`La télévision régionale prépare un débat sur la vie des maires et vous invite en direct, face à {depute}, député{deputeE} de votre circonscription. Le maquillage commence à 18 h 30.`,ch:[
  {l:`Y aller`,f:()=>skill('elo',0.5)?(attrUp('elo',2),{r:`Vous êtes clair{e}, drôle, précis{e}. Les extraits tournent toute la semaine.`,e:{p:2,r:3,rep:6}}):{r:`Une hésitation sur un chiffre, un sourire crispé : l’extrait qui circule n’est pas le bon.`,e:{r:-2,rep:1,sr:6}}},
  {l:`Envoyer {cab} à votre place`,e:{rep:1},r:`{cab} s’en sort honorablement. On aurait préféré vous voir.`},
  {l:`Décliner`,e:{},r:`Une autre maire du département prend votre place. Elle s’en sort bien.`}]},
 rep4:{l:'bureau',t:'Un cabinet ministériel vous appelle',x:`Un conseiller du ministère chargé des collectivités vous appelle : on cherche un maire de terrain pour co-signer un rapport national sur la vie des petites communes. Six mois de travail.`,ch:[
  {l:`Accepter la mission`,e:{rep:8,a:1,en:-8,fa:-4,sr:6},r:`Allers-retours à Paris, auditions, réunions tardives. Votre nom apparaît en couverture du rapport.`},
  {l:`Refuser : la ville ne se gère pas depuis Paris`,e:{p:1,rep:1},r:`Le refus fuite. Localement, il plaît.`}]},
 /* métier : police du maire, état civil, urbanisme, contrôle, responsabilité */
 arrete_bruit:{l:'place',t:'Le bar {bar} empêche le quartier de dormir',x:`Une pétition de quarante riverains arrive en mairie : musique, terrasse jusqu’à deux heures, cris. Le gérant vous rappelle qu’il emploie six personnes.`,ch:[
  {l:`Prendre un arrêté limitant l’heure de fermeture de la terrasse`,f:()=>skill('droit',0.55)?(attrUp('droit',1.5),{r:`L’arrêté est solide, motivé, proportionné. Le gérant grogne mais l’applique. Le quartier dort.`,e:{c:2,p:0.5,a:-0.5}}):{r:`L’arrêté, mal motivé, est suspendu par le tribunal administratif en référé. Le gérant pavoise sur les réseaux.`,e:{p:-1,r:-1.5,c:-0.5}}},
  {l:`Organiser une médiation entre le gérant et les riverains`,e:{c:1,e:0.5,en:-3},r:`Deux réunions, des concessions des deux côtés : fermeture de la terrasse à minuit et demi, musique coupée à minuit.`},
  {l:`Laisser faire : c’est la vie d’un centre-ville`,e:{a:1,c:-1.5,p:-0.5},r:`Les riverains écrivent au journal. Le bar, lui, ne désemplit pas.`}]},
 chien:{l:'quartier',t:'Un chien mord un enfant',x:`Un berger allemand a mordu un garçon de huit ans {rue}. Le propriétaire refuse de faire évaluer son chien. Les parents exigent que vous agissiez.`,ch:[
  {l:`Prescrire par arrêté une évaluation comportementale`,f:()=>skill('droit',0.6)?(attrUp('droit',1.5),{r:`La procédure est respectée. L’évaluation conclut à un risque élevé ; des mesures strictes sont imposées. Les parents vous remercient.`,e:{c:1.5,p:1}}):{r:`Un vice de forme permet au propriétaire de gagner du temps. Le quartier s’inquiète.`,e:{p:-1,c:-0.5}}},
  {l:`Confier l’affaire à la gendarmerie`,e:{c:0.5,rf:1},r:`La gendarmerie entend le propriétaire. L’affaire suit son cours, lentement.`},
  {l:`Tenter d’abord la conciliation`,e:{c:-0.5,e:0.5},r:`Le propriétaire promet une muselière. On le croise sans muselière le lendemain.`}]},
 mariage_doute:{l:'mariage',t:'Un mariage qui pose question',x:`À l’audition préalable, les futurs époux ne connaissent ni leurs dates de naissance respectives ni leurs adresses. Votre agent d’état civil vous fait part de ses doutes.`,ch:[
  {l:`Saisir le procureur de la République, comme le prévoit le Code civil`,f:()=>skill('droit',0.6)?{r:`Le parquet ouvre une enquête et sursoit au mariage. Votre agent se sent soutenu.`,e:{rf:3,e:0.5}}:{r:`Le dossier transmis est trop mince : le procureur ne s’y oppose pas. Le mariage aura lieu.`,e:{rf:-1}}},
  {l:`Célébrer : vous n’avez pas de preuve`,e:{},r:`Le mariage est célébré. Votre agent d’état civil n’en pense pas moins.`}]},
 premier_mariage:{l:'mariage',joy:1,t:'Votre premier mariage',x:`{pf} et {pm} se marient samedi. C’est votre premier mariage en écharpe : la salle est pleine, les témoins ont préparé des chansons.`,ch:[
  {l:`Écrire un discours personnel`,f:()=>skill('elo',0.6)?(attrUp('elo',1.5),{r:`Votre discours fait pleurer la grand-mère et rire les témoins. On vous le réclamera pour tous les mariages à venir.`,e:{p:1.5,fa:-1}}):{r:`Vous écorchez le prénom de la mariée. Elle en rit. Vous, un peu moins.`,e:{p:0.3}}},
  {l:`Lire les articles du Code civil, avec sobriété et chaleur`,e:{p:0.8},r:`Les articles 212 et suivants, lus d’une voix posée. Rien de plus, et c’est très bien.`}]},
 bapteme:{l:'mariage',joy:1,t:'Un baptême républicain',x:`Une famille demande un parrainage civil pour son bébé. La cérémonie n’a pas de valeur juridique, mais elle compte beaucoup pour eux.`,ch:[
  {l:`Célébrer vous-même`,e:{p:0.6,ra:1},r:`Le parrain jure de veiller sur l’enfant « dans l’attachement aux valeurs républicaines ». Le bébé dort pendant toute la cérémonie.`},
  {l:`Confier la cérémonie à un adjoint`,e:{},r:`{adj} officie avec soin.`}]},
 plu1:{l:'conseil',t:'Réviser le plan local d’urbanisme',x:`Le plan local d’urbanisme de {ville} date de quinze ans. Les services proposent de le réviser : zones à bâtir, terres agricoles, centre-bourg. C’est deux à trois ans de procédure.`,ch:[
  {l:`Lancer la révision avec une large concertation`,e:{m:-0.8,c:1,e:-0.5,en:-4},next:['plu2',200,1],r:`Réunions publiques, ateliers, cartes affichées en mairie. La procédure est lancée.`},
  {l:`Une révision allégée, centrée sur le centre-bourg`,e:{m:-0.4,c:0.5},next:['plu2',140,1],r:`Une procédure plus courte, ciblée.`},
  {l:`Reporter au prochain mandat`,e:{a:-0.5},r:`Le document actuel restera en vigueur. Les promoteurs vont ailleurs.`}]},
 plu2:{l:'salle',t:'L’enquête publique du PLU',x:`Le commissaire enquêteur rend son rapport : avis favorable, avec deux réserves sur l’ouverture à l’urbanisation de terres agricoles. Une association menace d’un recours.`,ch:[
  {l:`Lever les réserves avant l’approbation`,e:{c:1.5,a:-0.5,ra:2},r:`Le plan est approuvé par le conseil municipal. Il tiendra.`},
  {l:`Approuver le plan en l’état`,e:{a:1.5},next:['plu3',90,0.75],r:`Le plan est approuvé. L’association prépare son recours.`}]},
 plu3:{l:'prefecture',t:'Recours contre le PLU',x:`L’association a saisi le tribunal administratif. Votre avocat estime le dossier défendable, sans plus.`,ch:[
  {l:`Défendre le plan jusqu’au bout`,f:()=>skill('droit',0.5)?(attrUp('droit',2),{r:`Le tribunal rejette le recours. Les premiers permis peuvent être délivrés.`,e:{a:2,c:0.5}}):{r:`Le tribunal annule partiellement le plan. Deux ans de travail à reprendre.`,e:{e:-1.5,p:-1,m:-0.4}}},
  {l:`Négocier un retrait du recours contre des concessions`,e:{a:0.5,ra:3,e:-0.5},r:`L’association retire son recours. Une zone humide est préservée.`}]},
 penal1:{l:'quartier',t:'Un enfant blessé sur l’aire de jeux',x:`Un portique mal fixé a basculé {rue}. Une fillette a le bras cassé. Les parents demandent des comptes.`,ch:[
  {l:`Fermer toutes les aires de jeux le temps d’un contrôle complet`,e:{m:-0.6,p:0.5,c:-0.5},next:['penal2',60,0.35],r:`Toutes les aires sont contrôlées par un organisme agréé. Trois autres jeux sont remplacés.`},
  {l:`Réparer ce portique et passer à la suite`,e:{m:-0.1},next:['penal2',60,0.7],r:`Le portique est refixé dans la journée.`},
  {l:`Attendre le rapport de l’assureur`,e:{p:-1},next:['penal2',45,0.9],r:`L’aire reste fermée par un ruban. On attend.`}]},
 penal2:{l:'bureau',t:'Convocation à la gendarmerie',x:`Les parents ont porté plainte pour blessures involontaires. Vous êtes convoqué{e} à la gendarmerie pour une audition. Le maire peut voir sa responsabilité pénale engagée pour une faute non intentionnelle.`,ch:[
  {l:`S’y rendre avec l’avocat de la commune, dossier d’entretien à l’appui`,f:()=>skill('droit',0.55)?{r:`Les contrôles étaient à jour, les registres tenus : le parquet classe sans suite.`,e:{sr:-6}}:{r:`Le registre d’entretien est incomplet. Rappel à la loi pour la commune, et un article peu flatteur.`,e:{r:-2,p:-1,sr:8}}},
  {l:`Demander la protection fonctionnelle au conseil municipal`,e:{m:-0.3,e:0.5,sr:-4},r:`Le conseil vote la prise en charge de vos frais de défense. L’affaire suit son cours, vous êtes accompagné{e}.`}]},
 crc_ctrl:{l:'bureau',t:'La chambre régionale des comptes annonce un contrôle',x:`Un courrier recommandé : la chambre régionale des comptes contrôlera la gestion de {ville} sur les cinq derniers exercices. Les magistrats arrivent dans un mois.`,ch:[
  {l:`Coopérer pleinement, pièces à l’appui`,f:()=>skill('fin',0.55)?(attrUp('fin',2),{r:`Le rapport d’observations définitives salue une gestion rigoureuse. {journal} le reprend.`,e:{r:2,p:1}}):{r:`Le rapport pointe des marchés passés trop vite et un suivi lâche des subventions. Rien de pénal, mais la presse s’en régale.`,e:{r:-2,p:-1}}},
  {l:`Confier le dossier à {dgs}`,e:{en:3},f:()=>Math.random()<0.6?{r:`Les services répondent avec précision. Rapport neutre.`}:{r:`Une réponse tardive irrite les magistrats. Le rapport est sévère.`,e:{r:-1.5}}}]},
 dgf:{l:'bureau',t:'La dotation de l’État baisse',x:`La notification tombe : la dotation globale de fonctionnement de {ville} baisse cette année. Il manque de quoi payer deux postes.`,ch:[
  {l:`Réduire les dépenses de fonctionnement`,e:{c:-1,e:-0.5,m:0.3},r:`Horaires de la médiathèque réduits, éclairage public coupé plus tôt. Ça grince.`},
  {l:`Puiser dans la trésorerie`,e:{m:-1.2},r:`Le budget tient, la réserve fond.`},
  {l:`Faire monter les maires du département au créneau`,f:()=>skill('reseau',0.45)?{r:`Votre tribune commune avec vingt maires est reprise nationalement. Une compensation partielle est obtenue.`,e:{m:-0.3,rep:3,r:1}}:{r:`La tribune passe inaperçue. La baisse reste.`,e:{m:-0.8}}}]},
 attrib:{l:'conseil',t:'L’intercommunalité revoit sa copie',x:`La {interco} veut réviser l’attribution de compensation versée à {ville} : la commune perdrait une recette chaque année.`,ch:[
  {l:`Négocier pied à pied`,f:()=>skill('fin',0.4)||skill('reseau',0.4)?{r:`Vous obtenez une baisse étalée sur cinq ans et une compensation en investissements.`,e:{m:-0.2,a:0.5}}:{r:`Vous êtes mis{e} en minorité. La baisse est votée.`,e:{m:-0.8,e:-0.5}}},
  {l:`Accepter, au nom de l’intérêt communautaire`,e:{m:-0.6,rf:1},r:`Vos collègues apprécient. Vos finances un peu moins.`}]},
 menaces:{l:'bureau',t:'Menaces sur les réseaux',x:`Depuis votre dernière décision, un compte anonyme publie votre adresse personnelle et des messages de plus en plus violents.`,ch:[
  {l:`Porter plainte et demander la protection fonctionnelle`,e:{rf:2,p:1,sr:-4,m:-0.1},r:`La gendarmerie identifie l’auteur en dix jours. Le conseil municipal vous témoigne son soutien unanime.`},
  {l:`Répondre publiquement, posément`,f:()=>skill('elo',0.5)?{r:`Votre réponse, ferme et calme, retourne l’opinion. Le compte disparaît.`,e:{p:1.5,r:1}}:{r:`Votre réponse alimente la polémique. Les messages redoublent.`,e:{sr:10,r:-1}}},
  {l:`Ignorer`,e:{sr:12,fa:-4},r:`Vous ne répondez pas. Votre famille, elle, a lu les messages.`}]},
 concessions:{l:'cimetiere',t:'Les concessions abandonnées',x:`Le cimetière est plein. Des dizaines de concessions ne sont plus entretenues depuis des décennies. Leur reprise suppose une procédure de plusieurs années, avec constats et affichages.`,ch:[
  {l:`Lancer la procédure de reprise`,e:{c:1,m:-0.2,e:-0.5},r:`Les premiers constats sont dressés. Quelques familles se manifestent, émues de retrouver une tombe oubliée.`},
  {l:`Agrandir le cimetière`,e:{m:-1,c:0.5},r:`Un terrain voisin est acquis. Le problème est repoussé de vingt ans.`}]},
 recensement:{l:'bureau',t:'Le recensement de la population',x:`L’Insee annonce le recensement de {ville} pour le début de l’année. La mairie doit recruter des agents recenseurs.`,cond:()=>S.ville.pop<10000,ch:[
  {l:`Recruter des jeunes de la commune`,e:{p:0.5,m:-0.1},r:`Six étudiants sillonnent la commune en janvier. Les chiffres tombent au printemps.`},
  {l:`Confier la tâche aux agents de la mairie`,e:{e:-0.5},r:`Les services s’en chargent, en plus du reste.`}]},
 bureau_vote:{l:'salle',t:'Tenir les bureaux de vote',x:`Les élections nationales approchent. Il faut présider les bureaux de vote de {ville}, et il manque des assesseurs.`,ch:[
  {l:`Présider vous-même le bureau principal toute la journée`,e:{p:1,en:-8},r:`De 8 heures au dépouillement, vous serrez des mains. Les habitants apprécient.`},
  {l:`Lancer un appel aux habitants volontaires`,e:{p:0.5,ra:1},r:`Une trentaine de volontaires se présentent, dont plusieurs jeunes qui votent pour la première fois.`}]},
 /* voisins */
 vois_mutu:{l:'bureau',t:'{vv} propose de mutualiser',x:`{vn}, maire de {vv}, propose de partager une police municipale et un garde champêtre entre vos deux communes.`,ch:[
  {l:`Accepter`,e:{c:1.5,m:-0.5,rv:12},r:`Une convention est signée. Les deux agents tournent sur les deux communes.`},
  {l:`Négocier une répartition des coûts plus favorable`,f:()=>skill('fin',0.5)?{r:`{vn} accepte 60-40 en votre faveur.`,e:{c:1,m:-0.2,rv:3}}:{r:`{vn} se vexe et retire sa proposition.`,e:{rv:-8}}},
  {l:`Refuser`,e:{rv:-8,p:0.3},r:`Chacun chez soi.`}]},
 vois_zone:{l:'chantier',t:'{vv} veut sa zone commerciale',x:`{vn} prépare une zone commerciale en entrée de ville, à trois kilomètres de votre centre. Vos commerçants s’inquiètent.`,ch:[
  {l:`S’y opposer au conseil communautaire`,f:()=>skill('reseau',0.5)?{r:`Le projet est réduit de moitié. {vn} ne vous adresse plus la parole.`,e:{a:1,p:1,rv:-15}}:{r:`Vous êtes battu{e} au vote. La zone se fera, et vous avez un ennemi.`,e:{rv:-15,e:-0.5}}},
  {l:`Négocier un partage des recettes fiscales`,e:{m:0.4,a:0.5,rv:5},r:`Un accord est trouvé : une part de la fiscalité reviendra à {ville}.`},
  {l:`Laisser faire`,e:{a:-2,p:-1,rv:4},r:`La zone ouvre deux ans plus tard. Le café de la place ferme.`}]},
 vois_aide:{l:'fete',joy:1,t:'Un coup de main de {vv}',x:`Votre fête approche et le chapiteau est déchiré. {vn}, maire de {vv}, vous prête le sien, avec deux agents pour le monter.`,ch:[

  const A=adviser();if(!A.p)return;
  const sc=def.ch.map(c=>scoreChoice(c,A.p));const order=sc.map((v,i)=>i).sort((a,b)=>sc[b]-sc[a]);
  const close=order.length>1&&Math.abs(sc[order[0]]-sc[order[1]])<0.35;
  if(!(S.opts&&S.opts.mode==='decouverte')&&Math.random()<(close?0.45:0.14)){it.advBy=A.k;it.free=true;chatPush(A.k,`« ${it.tt||fill(def.t)} » : ${vary('advfree',ADV_FREE)}`,{it:it.id});return;}
  const pickI=Math.random()<0.82?order[0]:order[1]===undefined?order[0]:order[1];
  const c=def.ch[pickI],e=c.e||{};let dom='p',dv=0;['p','c','a','e','r','m'].forEach(k=>{const v=Math.abs((e[k]||0)*(k==='m'?1.5:1));if(v>dv){dv=v;dom=k;}});if((c.f||c.chk)&&dv<1)dom='f';if(c.vote)dom='vote';

  const forms=[o=>`${o} sur « ${it.tt||fill(def.t)} », je partirais sur « ${fill(c.l,it.tok)} ». ${capF(vary('why'+dom,ADV_WHY[dom]))}.`,o=>`${o} « ${fill(c.l,it.tok)} ». Pourquoi ? Parce que ${vary('why'+dom,ADV_WHY[dom])}.`,o=>`Sur « ${it.tt||fill(def.t)} » : ${vary('why'+dom,ADV_WHY[dom])}, donc « ${fill(c.l,it.tok)} ». ${o==='Sans hésiter :'?'Sans hésiter.':''}`.trim()];
  it.adv=pickI;it.advBy=A.k;
  chatPush(A.k,pick(forms)(vary('advopen',ADV_OPEN))+warn,{it:it.id,advice:pickI});
};

/* Mode du point du soir : 'tous' les soirs, ou 'auto' (seulement quand un arbitrage est nécessaire) */
function needPoint(d){const D=agDay(d);if(D.ok)return false;if(S.agMode==='jamais')return false;if((S.agMode||'tous')==='tous')return true;return D.items.some(x=>x.st==='prop'&&(x.imp||x.conflit));}
function validateDay(d,auto){const D=agDay(d);D.ok=true;D.items.forEach(x=>{if(x.st==='prop')x.st='ok';});
  if(auto){D.items.filter(x=>x.perso&&x.conflit).forEach(pp=>{const other=D.items.find(x=>x!==pp&&x.h===pp.h&&x.st==='ok');if(other){if(S.famille<45||pp.imp)other.st='non';else pp.st='non';}});}
  const refus=D.items.filter(x=>x.src==='cab'&&x.st==='non').length;const k=chefK();if(refus>=2)trustAdd(k,-1);else trustAdd(k,0.3);}

/* ----- Continuer : un point chaque soir ----- */
continuer=function(){
  if(UI.running)return;
  if(pending().length){UI.tab='accueil';UI.sel=pending()[0].id;render();return;}
  UI.running=true;UI.evening=false;render();
  const step=()=>{
    if(S.phase!=='play'||UI.screen!=='jeu'){UI.running=false;render();return;}
    const res=execDay(S.day);if(res.length)UI.dayRes=res.filter(x=>!x.perso||x.st==='fait');
    if(needPoint(S.day+1)){UI.running=false;UI.evening=true;planDay2(S.day+1);save();render();return;}
    if((S.agMode||'tous')!=='tous')validateDay(S.day+1,true);
    tickDay();UI.dayRes=null;
    const dEl=document.getElementById('dateDisp');if(dEl)dEl.textContent=dateLong(S.day);
    const stop=pending().length>0||dOf(S.day).getUTCDay()===1||S.phase!=='play';
    if(stop){UI.running=false;if(pending().length){UI.tab='accueil';UI.sel=pending()[0].id;}save();render();return;}
    runTimer=setTimeout(step,reduced()?0:stepMs());};
  runTimer=setTimeout(step,reduced()?0:Math.min(120,stepMs()));
};
function planDay2(d){const D=agDay(d);if(D.last)return;D.last=1;
  if(Math.random()<0.3){const P=pick(AGP.filter(x=>!x.req&&(!x.cond||x.cond())&&!D.items.some(y=>y.k===x.k)));const it=mkItem(P,'cab','prop');it.urgent=1;const h=freeSlot(D,P.h);if(h){it.h=h;D.items.push(it);D.items.sort((a,b)=>a.h.localeCompare(b.h));}}
  const k=chefK(),p=chefP();if(p){const nb=D.items.filter(x=>x.st!=='non').length;const line=nb>=4?vary('evbusy',['Grosse journée demain, garde des forces.','Demain, ça s’enchaîne. Dors tôt.','Je sais, c’est beaucoup. Mais tout est utile.']):nb===0?vary('evfree',['Demain est libre. Tu peux ajouter ce que tu veux, ou souffler.','Rien de prévu demain. Profite, ou va sur le terrain.']):vary('evopen',EVE_OPEN);D.chefLine=line;}}

function genQuartiers(v){
  const n=v.pop<800?3:v.pop<5000?4:v.pop<30000?5:6;const names=shuffle(Q_NAMES);const out=[];
  out.push({n:v.pop<5000?'Le centre-bourg':'Le centre-ville',t:'centre'});
  const types=shuffle(['lotis','residentiel',v.pop<5000?'hameau':'cite',v.pop>3000?'gare':'hameau','lotis','residentiel']);
  for(let i=1;i<n;i++){const t=types[i-1];out.push({n:t==='lotis'?'Lotissement '+pick(LOTIS):t==='hameau'?'Le hameau '+pick(['de la Bergerie','des Granges','du Puits','de Bellevue','des Combes','du Bois-Joli']):names[i],t});}
  const w=out.map(q=>q.t==='centre'?1.3:q.t==='hameau'?0.35:q.t==='cite'?1.2:1);const tw=w.reduce((a,b)=>a+b,0);
  const prios=Object.keys(PRIOS);
  return out.map((q,i)=>({...q,id:'q'+i,pop:Math.round(v.pop*w[i]/tw),sat:clamp(52+R(-12,12)),att:{centre:'attractivite',lotis:'jeunesse',hameau:'proximite',cite:'social',gare:'tranquillite',residentiel:'patrimoine'}[q.t]||pick(prios),ref:(()=>{const g=pick(['f','m']),p=personName(g);return p.prenom+' '+p.nom;})()}));
}

function genPopStats(v){

function rulesHTML(){
  return `<div class="rules">
  <h3>Le principe</h3><p>Vous êtes maire d’une commune française fictive, élue en mars 2026. Le département et la région sont réels, comme les présidents de région ; la commune, ses habitants, votre équipe et les autres élus sont inventés. Le mandat dure jusqu’aux municipales de mars 2032, puis vous pouvez vous représenter.</p>
  <h3>Le temps</h3><p>Le bouton <b>Continuer</b> fait défiler les jours. Il s’arrête quand une décision arrive dans votre boîte de réception, et à chaque début de semaine. On ne peut pas avancer tant qu’une décision attend une réponse.</p>
  <h3>Les décisions</h3><p>Chaque décision a des effets sur cinq jauges : popularité, cadre de vie, attractivité, cohésion de votre majorité et image dans la presse, ainsi que sur la trésorerie. Certaines ont des suites des semaines plus tard. Certains textes passent au vote du conseil municipal : si votre majorité se divise, ils peuvent être rejetés.</p>
  <h3>L’agenda et le point du soir</h3><p>Chaque soir, votre chef de cabinet vous présente la journée du lendemain : rendez-vous obligatoires, propositions à accepter ou refuser, parfois un dîner de famille qui tombe à la même heure qu’une assemblée générale. Vous pouvez ajouter jusqu’à trois initiatives par jour et consulter les semaines à venir dans l’onglet Agenda. Les sorties immédiates sur la carte consomment vos créneaux de la semaine. Chaque rendez-vous fatigue un peu ; refuser a aussi un prix.</p><h3>La messagerie, la presse et les notes</h3><p>Chaque membre du cabinet vous écrit dans sa propre conversation. Le lundi, la revue de presse arrive au courrier. Vos conseillers vous soumettent aussi des notes sur leur thématique, à adopter, tester ou refuser : ils s’en souviennent. Sur certains dossiers, votre directeur de cabinet ne donne pas d’avis et vous laisse trancher.</p>
  <h3>Messagerie et cabinet</h3><p>Dans l’onglet Messagerie, chaque membre de votre cabinet vous écrit par SMS. Votre directeur ou directrice de cabinet vous tutoie, donne son avis sur chaque dossier et commente votre semaine ; les autres vous tiennent au courant de leur domaine. Suivre ou non un conseil fait varier la confiance. Dans l’onglet Cabinet, vous recrutez des conseillers, réunissez l’équipe et parlez à chacun. Si la confiance s’effondre, on démissionne.</p><h3>Les réseaux sociaux</h3><p>Chaque sortie sur le terrain est publiée sur votre compte. Les j’aime, les partages et les commentaires donnent la température. Vous pouvez aussi publier vous-même.</p><h3>Chaque partie est différente</h3><p>Les événements, leurs lieux et leurs protagonistes, les projets proposés et leurs coûts changent d’une partie à l’autre.</p><h3>Les finances</h3><p>Les dépenses et la fiscalité ne se modifient qu’au vote du budget (avril) et à la décision modificative (octobre). Les chantiers sont payés au fil des travaux. L’emprunt est possible tant que la capacité de désendettement reste sous douze ans. Si la trésorerie plonge, la chambre régionale des comptes intervient.</p>
  <h3>Le conseil municipal</h3><p>Vous ne choisissez pas vos élus : ils ont été élus avec vous sur une liste paritaire. Les adjoints sont élus par le conseil. Vous recrutez en revanche vos collaborateurs : directeur ou directrice de cabinet, chef ou cheffe de cabinet dans les grandes villes, DGS ou secrétaire générale de mairie selon la taille de la commune.</p>
  <h3>Les élections</h3><p>Avant la fin du mandat, un bilan s’affiche. Vous pouvez alors vous lancer dans la campagne : programme, composition de la liste, puis soirée électorale. Depuis 2026, toutes les communes votent au scrutin de liste paritaire ; la liste gagnante reçoit la moitié des sièges, le reste est réparti à la proportionnelle entre les listes ayant obtenu au moins 5 % des voix.</p>
  <h3>Votre étiquette</h3><p>Votre positionnement politique ne donne aucun avantage en soi. Ce qui compte, c’est l’écart entre vos idées et la sensibilité de la commune, qui est tirée au hasard. Le parrainage présidentiel de 2027 propose des candidats fictifs, un par grande famille politique, car la liste officielle n’est publiée par le Conseil constitutionnel qu’au printemps 2027.</p>
  <h3>La carrière</h3><p>Chaque dossier, chaque sortie et chaque défi de la semaine rapportent de l’expérience. Un niveau gagné donne deux points à répartir entre six attributs : éloquence, finances publiques, droit public, réseau, sang-froid et terrain. Ils décident de l’issue des dossiers délicats, comme un arrêté attaqué ou un plateau télévisé. Tous les trois niveaux, vous choisissez un trait qui ouvre parfois une option supplémentaire dans les dossiers.</p>
  <h3>Le corps et la maison</h3><p>Le stress monte avec les dossiers et redescend avec le repos, le sport, la famille. Au-delà de 75, une décision peut tourner au faux pas. Une santé trop basse impose un arrêt maladie, pendant lequel votre premier adjoint assure l’intérim.</p>
  <h3>Les visages et la réputation</h3><p>Trois maires voisins, six habitants récurrents et un opposant qui change de stratégie chaque année se souviennent de vos choix. Votre réputation grandit avec les succès et ouvre des sollicitations départementales, régionales puis nationales. Votre ambition, fixée au début du mandat, et vos succès sont suivis dans l’onglet Carrière, avec l’album des grands moments.</p>
  <h3>Sources des données réelles</h3><p>Présidents de région : regions-gouv.fr et Région Sud, vérifiés au 1er novembre 2026 ; ce sont les seuls élus réels du jeu. Députés, sénateurs et présidents de département sont inventés, avec leur orientation politique ; seul le nombre de sénateurs correspond au vrai département. Règles du scrutin : Code électoral, article L. 262, et loi du 21 mai 2025. Secrétaires généraux de mairie : loi du 30 décembre 2023.</p>
  </div>`;
}

function lineChart(pts,{h=150,label='Popularité'}={}){
  if(pts.length<2)return '<p class="mut small">Les données s’accumulent au fil des semaines.</p>';
  const W=360,H=h,pl=30,pr=10,pt=10,pb=22;const x0=pts[0].d,x1=pts[pts.length-1].d||1;
  const X=d=>pl+(d-x0)/(x1-x0||1)*(W-pl-pr),Y=v=>pt+(100-v)/100*(H-pt-pb);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v!==undefined?p.v:p.p).toFixed(1)).join('');
  let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" class="axis">${v}</text>`;});
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${label}">${g}<path d="${path} L${X(last.d)} ${Y(0)} L${X(x0)} ${Y(0)}Z" class="area"/><path d="${path}" class="line"/><circle cx="${X(last.d)}" cy="${Y(last.v!==undefined?last.v:last.p)}" r="4" class="dotp"/><text x="${pl}" y="${H-5}" class="axis">${moisTxt(x0)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end" class="axis">${moisTxt(x1)}</text></svg>`;
}

function vChat(){
  const A=adviser();const ak=A.k;
  const ths=[];const seen=new Set();
  const add=k=>{if(seen.has(k))return;const p=memberOf(k);if(!p)return;seen.add(k);ths.push(k);};
  add(ak);Object.keys(S.staff).forEach(k=>{if(S.staff[k])add(k);});S.cons.forEach(c=>add(c.id));
  S.chat.forEach(m=>{const t=thOf(m);if(!seen.has(t)&&memberOf(t))add(t);});
  let th=UI.thread&&seen.has(UI.thread)?UI.thread:ak;
  const msgsOf=k=>S.chat.filter(m=>thOf(m)===k&&shown(m));
  ths.sort((a,b)=>{const la=msgsOf(a).slice(-1)[0],lb=msgsOf(b).slice(-1)[0];return (lb?S.chat.indexOf(lb):-1)-(la?S.chat.indexOf(la):-1);});
  if(UI.threadOpen||(typeof window!=='undefined'&&window.innerWidth>=760)){S.chat.forEach(m=>{if(thOf(m)===th)m.u=false;});}
  S.chatUnread=S.chat.filter(m=>m.u&&shown(m)).length;chatTimer();
  const list=ths.map(k=>{const p=memberOf(k),ms=msgsOf(k),last=ms.slice(-1)[0],un=ms.filter(m=>m.u).length;
    return `<button class="thr ${k===th?'on':''}" data-act="thread" data-v="${k}">${figureSVG(p.av,{size:46})}<span class="thm"><b>${esc(p.prenom)} ${esc(p.nom)}</b><small>${esc(memberRole(k,p))}</small><em>${last?esc((last.from==='me'?'Vous : ':'')+last.txt):'Aucun message'}</em></span><span class="thr2">${last?`<small>${dateTxt(last.day).replace(/ \d{4}$/,'')}</small>`:''}${un?`<i>${un}</i>`:''}</span></button>`;}).join('');
  const p=memberOf(th);const ms=msgsOf(th).slice(-70);let lastDay=-1;
  const bub=m=>{let sep='';if(m.day!==lastDay){lastDay=m.day;sep=`<div class="cday">${dateLong(m.day)}</div>`;}
    if(m.from==='sys')return sep+`<div class="csys">${esc(m.txt)}</div>`;
    const me=m.from==='me';const it=m.it?S.inbox.find(x=>x.id===m.it):null;
    const acts=it&&!it.done&&m.advice!==undefined?`<div class="cacts"><button class="btn small" data-act="chatFollow" data-v="${it.id}">OK, je suis ton avis</button><button class="btn small ghost" data-act="open2" data-v="${it.id}">Voir le dossier</button></div>`:'';
    return sep+`<div class="bub ${me?'me':'them'}">${esc(m.txt)}<span class="bt">${dateTxt(m.day).replace(/ \d{4}$/,'')}</span>${acts}</div>`;};
  const reps=[['ok','Bien noté, merci'],['point','On en parle demain ?'],['bravo','Bravo, beau travail'],...(th===ak&&ak!=='adj'?[['seul','Laisse-moi trancher seul']]:[])];
  const conv=p?`<div class="conv"><div class="chathead"><button class="tbtn back" data-act="threadBack" aria-label="Retour aux conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>${figureSVG(p.av,{size:44})}<div><b>${esc(p.prenom)} ${esc(p.nom)}</b><span>${esc(memberRole(th,p))} · confiance ${Math.round(p.trust||60)} %</span></div>${bar(p.trust||60)}</div>
    <div class="chat" id="chat">${ms.map(bub).join('')||'<div class="csys">Pas encore de message.</div>'}${S.chat.some(m=>thOf(m)===th&&!shown(m))?`<div class="bub them typing" aria-label="${esc(p.prenom)} est en train d’écrire"><i></i><i></i><i></i></div>`:''}</div>
    <div class="replies">${reps.map(([k,l])=>`<button class="chip" data-act="reply" data-v="${k}">${l}</button>`).join('')}</div></div>`:'';
  return `<div class="msgr ${UI.threadOpen?'open':''}"><div class="thlist panel"><header class="ph"><h3>Messagerie</h3></header><div class="pb">${list}</div></div>${conv}</div>`;
}

  campBack(){UI.camp.step=0;render();},
  toggleKeep(b){const id=b.dataset.v;S.campKeep[id]=S.campKeep[id]===false?true:false;render();},
  campGo(){S.liste=majorite().filter(m=>m.role!=='maire').map(m=>S.campKeep[m.id]===false?m.rep:m);S.campagne=true;S.phase='play';S.campBonus=0;
    info('Préfecture','Liste déposée',`La liste « ${S.listeNom} » est enregistrée. Il reste ${Math.max(0,Math.round((S.elecDay-S.day)/7))} semaines de campagne : le terrain compte double.`);save();UI.tab='agenda';render();window.scrollTo(0,0);},
  tour2(){UI.round=2;S.day+=7;save();render();window.scrollTo(0,0);},
  install(){UI.round=1;S.elecDay+=2184;newMandate();window.scrollTo(0,0);},
  lose(){S.fin='defaite';S.phase='bilan';UI.round=1;save();render();window.scrollTo(0,0);},
  restart(){clearSave();S=null;UI={...UI,screen:'title',tab:'accueil',sel:null};render();window.scrollTo(0,0);}
};
ACT.spendPt=b=>spendPt(b.dataset.v);ACT.pickPerk=b=>pickPerk(b.dataset.v);ACT.train=b=>train(b.dataset.v);
ACT.topToggle=()=>{UI.topMin=!UI.topMin;try{localStorage.setItem('echarpe-topmin',UI.topMin?'1':'0');}catch(e){}render();};
ACT.thread=b=>{UI.thread=b.dataset.v;UI.threadOpen=true;render();const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;if(window.innerWidth<760)window.scrollTo(0,0);};
ACT.threadBack=()=>{UI.threadOpen=false;render();};
ACT.agDay=b=>{UI.agDay=+b.dataset.v;UI.agAdd=null;render();};
ACT.agSet=b=>{const [d,id,st]=b.dataset.v.split('|');const D=agDay(+d);const it=D.items.find(x=>x.id===id);if(it&&it.src==='moi'&&st==='non'){D.items=D.items.filter(x=>x!==it);}else setItem(+d,id,st);save();render();};
ACT.agAdd=b=>{const [d,pk,ak]=b.dataset.v.split('|');if(addMine(+d,pk,ak)){toast('Ajouté à l’agenda');save();}render();};
ACT.agAddT=()=>{const sel=UI.agDay==null?S.day:UI.agDay;UI.agAdd=UI.agAdd===sel?null:sel;render();};
ACT.agAddT2=()=>{UI.evAdd=!UI.evAdd;render();};
ACT.evValidate=()=>evValidate();ACT.evDelegate=()=>evDelegate();
ACT.agMode=b=>{S.agMode=b.dataset.v;save();render();};
ACT.introOk=b=>{seenSet(b.dataset.v);render();};
ACT.ctab=b=>{UI.ctab=b.dataset.v;render();};ACT.renov=b=>renovate(b.dataset.v);ACT.label=b=>tryLabel(b.dataset.v);
ACT.meetA=b=>meetAct(b.dataset.v);ACT.meetClose=()=>meetClose();
ACT.vicNext=()=>{UI.vic=(UI.vic||0)+1;render();window.scrollTo(0,0);};
ACT.vicSay=b=>{UI.vicSpeech=b.dataset.v;const x=SPEECH.find(s=>s[0]===b.dataset.v);applyE(x[3]);if(typeof sfx==='function')sfx('success');render();};
ACT.vicGo=()=>{UI.vicDone=true;beginGame();UI.vicDone=false;};
ACT.closeMoment=()=>{UI.moment=null;render();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.moment){UI.moment=null;render();}});
ACT.theme=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const t=dark?'light':'dark';setTheme(t);try{localStorage.setItem('echarpe-theme',t);}catch(e){}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){if(b.dataset.act!=='sound'&&typeof sfx==='function')sfx('click');const n0=S&&S.chat?S.chat.length:0;f(b);if(S&&S.chat&&S.chat.length>n0){stagger(n0);render();}}});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='prefMusic'||id==='prefSfx'){const v=+e.target.value;if(id==='prefMusic'){PREF.music=v;if(SND.ambG&&SND.ctx)SND.ambG.gain.setTargetAtTime(0.022*musVol(),SND.ctx.currentTime,0.2);if(v===0)ambStop();else if(SND.on)ambStart();}else{PREF.sfx=v;sfx('click');}prefSave();const lb=e.target.previousElementSibling;if(lb)lb.textContent=(id==='prefMusic'?'Musique de fond':'Effets sonores')+' · '+v+' %';return;}
  if(id==='vfReg'){UI.vf.reg=e.target.value;rollVille();return;}
  if(id==='listeNom'&&S){S.listeNom=e.target.value;return;}
  if(!UI.draft)return;
  if(id==='prenom'||id==='nom'){UI.draft[id]=e.target.value;const p=document.getElementById('pname');if(p)p.textContent=UI.draft.prenom+' '+UI.draft.nom;}
  if(id==='age'){UI.draft.age=+e.target.value;document.getElementById('agev').textContent=UI.draft.age;}
});
window.claude?.hot?.snapshot?.(()=>({S,UI:{...UI,running:false,rolling:false}}));
function start(d){if(d&&d.UI){S=d.S;UI=d.UI;}render();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body>
</html>
