      [300,322,344].forEach(x=>g+=`<path d="M${x-8} 124L${x} 100L${x+8} 124Z" ${F(P)}/><rect x="${x-5}" y="110" width="10" height="3" fill="#fff"/>`); g+=`<rect y="122" width="360" height="8" ${F(INK)} opacity=".5"/>`; break;
    case 'prefecture':
      g=`<rect x="60" y="48" width="240" height="70" ${F(SF)}/><path d="M50 50L180 16L310 50Z" ${F(P)}/>`;
      for(let i=0;i<7;i++)g+=`<rect x="${78+i*32}" y="54" width="12" height="62" rx="2" ${F(P2)}/>`;
      g+=`<rect x="44" y="116" width="272" height="6" ${F(INK)} opacity=".6"/><rect x="34" y="122" width="292" height="8" ${F(INK)} opacity=".45"/>`+flag(20,40,0.9)+flag(318,40,0.9); break;
    case 'inaug':
      for(let i=0;i<14;i++){const x=12+i*26;g+=`<path d="M${x-8} 14L${x+8} 14L${x} 30Z" ${F(i%3===0?'#000091':i%3===1?'#fff':'#E1000F')}/>`;}
      g+=`<path d="M0 14H360" ${STK(INK,1)}/><rect x="0" y="74" width="360" height="5" fill="#000091"/><rect x="0" y="79" width="360" height="5" fill="#fff"/><rect x="0" y="84" width="360" height="5" fill="#E1000F"/><path d="M180 81l-22-14v28ZM180 81l22-14v28Z" ${F(P)}/><circle cx="180" cy="81" r="6" ${F(P2)}/><g transform="rotate(-24 250 104)"><circle cx="236" cy="112" r="7" ${STK(INK,3)}/><circle cx="252" cy="116" r="7" ${STK(INK,3)}/><path d="M242 106L276 86M246 110L278 96" ${STK(INK,3)}/></g><rect y="118" width="360" height="12" ${F(P)} opacity=".3"/>`; break;
    case 'littoral':
      g=`<rect y="78" width="360" height="52" style="fill:#86b6e8" opacity=".55"/><path d="M0 80q15-6 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0" ${STK(SF,2)}/><path d="M0 70Q180 58 360 72V82H0Z" style="fill:#e9d7a6" opacity=".9"/><rect x="290" y="20" width="16" height="52" ${F(SF)}/><rect x="290" y="30" width="16" height="8" ${F(P)}/><rect x="290" y="48" width="16" height="8" ${F(P)}/><path d="M286 20h24l-12-12Z" ${F(INK)}/><path d="M90 96l20-26v26ZM150 104l16-20v20Z" ${F(P2)}/><path d="M80 96h40l-6 8H86ZM142 104h30l-5 6h-20Z" ${F(INK)} opacity=".8"/>`; break;
    case 'montagne':
      g=`<path d="M0 110L70 36L120 80L190 18L260 86L310 50L360 96V130H0Z" ${F(P2)} opacity=".6"/><path d="M58 50L70 36L82 50L76 46L70 52L64 46ZM176 34L190 18L204 34L196 30L190 38L184 30Z" fill="#fff"/><path d="M20 30L340 100" ${STK(INK,1.4)}/>${[60,120,180,240,300].map((x,i)=>`<rect x="${x}" y="${43+i*14.5}" width="10" height="8" rx="2" ${F(P)}/>`).join('')}<rect x="40" y="96" width="34" height="26" ${F(SF)}/><path d="M34 98L57 82L80 98Z" ${F(INK)} opacity=".8"/><rect y="122" width="360" height="8" fill="#fff" opacity=".8"/>`; break;
    case 'cimetiere':
      g=`<rect y="96" width="360" height="34" ${F(P2)} opacity=".35"/><rect x="0" y="88" width="360" height="10" ${F(SF)} style="fill:var(--surf);stroke:var(--pink2);stroke-width:1"/>${[40,90,140,220,270,320].map(x=>`<path d="M${x} 120V100M${x-7} 106H${x+7}" ${STK(INK,3)}/>`).join('')}<path d="M180 120V40" ${STK(INK,2)}/><ellipse cx="180" cy="60" rx="10" ry="34" ${F('var(--good)')} opacity=".6"/><ellipse cx="330" cy="58" rx="9" ry="30" ${F('var(--good)')} opacity=".6"/>`; break;
    case 'mariage':
      g=`<path d="M110 130V70Q110 22 180 22Q250 22 250 70V130" ${STK(P,10)}/><path d="M110 70Q110 22 180 22Q250 22 250 70" ${STK(P2,4)} transform="translate(0 -12)"/><circle cx="170" cy="86" r="16" ${STK('#d9a520',5)}/><circle cx="192" cy="86" r="16" ${STK('#d9a520',5)}/>`;
      for(let i=0;i<20;i++)g+=`<ellipse cx="${(i*53)%360}" cy="${(i*37)%110+8}" rx="3" ry="5" ${F(i%2?P:P2)} transform="rotate(${i*30} ${(i*53)%360} ${(i*37)%110+8})" opacity=".8"/>`; break;
  }
  return `<svg viewBox="0 0 360 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs><rect width="360" height="130" fill="url(#${id})"/>${g}</svg>`;
}

const LIEUX={littoral:'Front de mer',montagne:'En montagne',cimetiere:'Cimetière communal',bureau:'Bureau du maire',conseil:'Salle du conseil',stade:'Stade municipal',place:'Place de la mairie',fete:'Place des fêtes',ecole:'École {ecole}',quartier:'En ville',presse:'Face à la presse',salle:'Salle des fêtes',chantier:'Chantier',prefecture:'Préfecture',inaug:'Inauguration',mariage:'Salle des mariages'};

const geo=()=>S.ville.geo, regn=()=>S.ville.region, dep=()=>S.ville.dep, sud=()=>["Provence-Alpes-Côte d'Azur",'Occitanie','Corse','Nouvelle-Aquitaine'].includes(regn());
function matchRes(bonus){const rug=S.ville.sport==='rugby';const a=rug?RI(9,38):RI(0,4),b=rug?RI(6,33):RI(0,3);
 if(a>b)return{r:rug?`Victoire ${a} à ${b}, avec un essai en coin dans les dernières minutes. La troisième mi-temps se prolonge à la buvette.`:`Victoire ${a} à ${b}. Les supporters chantent le nom du club, puis le vôtre, ce qui est plus rare.`,e:{p:bonus+1,a:1}};
 if(a===b)return{r:`Match nul, ${a} partout. Le président du {club} vous offre une écharpe aux couleurs du club.`,e:{p:bonus-1}};
 return{r:rug?`Défaite ${a} à ${b}. Vous restez jusqu'au bout et serrez la main des joueurs dans le couloir des vestiaires, ce qu'ils remarquent.`:`Défaite ${a} à ${b}. Vous restez jusqu'au bout et serrez la main des joueurs, ce qu'ils remarquent.`,e:{p:bonus-2,e:1}};}
const EV={
 install:{l:'conseil',t:'Installation du conseil municipal',x:()=>S.mandat===1?`Salle du conseil, quelques jours après le scrutin. Les {nbc} conseillers municipaux sont réunis. Le doyen d'âge préside la séance et appelle au vote : votre nom l'emporte au premier tour. Vous voilà maire {deVille}, avec une écharpe tricolore un peu raide sur l'épaule. Il reste à dire quelques mots.`:`Réélu{e}, vous retrouvez la salle du conseil pour ouvrir votre mandat numéro ${S.mandat}. Les têtes ont changé sur les bancs de l'opposition. {opp} est assis au premier rang, bras croisés.`,ch:[
  {l:`Un discours de rassemblement, la main tendue à l'opposition`,e:{p:3,e:1,r:2},r:`{opp} applaudit du bout des doigts. Le public, lui, applaudit vraiment.`},
  {l:`Un discours de combat : le travail commence ce soir`,e:{p:2,e:3,r:-1},r:`Votre majorité est galvanisée. L'opposition quitte la salle avant le verre de l'amitié.`},
  {l:`Trois phrases sobres, puis le verre de l'amitié`,e:{e:1,p:1},r:`On retiendra surtout le verre de {boisson}, servi bien frais.`}]},
 voeux:{l:'salle',t:'La cérémonie des vœux',x:`Un samedi de janvier, salle des fêtes. Trois cents chaises, la galette commandée chez le boulanger, et {com} qui vous tend la dernière version du discours.`,ch:[
  {l:`Annoncer un grand projet pour l'année`,e:{p:3,r:2,e:-1},r:`L'annonce fait la une de {journal} le lundi suivant. Il faudra maintenant la tenir.`},
  {l:`Remercier un à un les bénévoles des associations`,e:{p:2,e:2,c:1},r:`Le président du club de pétanque essuie une larme. On en parlera longtemps.`},
  {l:`Un discours bref et la galette partagée`,e:{p:1,m:-0.3},r:`La fève tombe dans la part du sous-préfet, qui porte la couronne avec un sérieux admirable.`}]},
 budget:{l:'conseil',t:'Le vote du budget',x:`Le conseil doit voter le budget primitif avant la mi-avril. {dgs}, votre {dgsR}, a préparé trois scénarios pour la taxe foncière, aujourd'hui {taxeTxt}. Trésorerie : {cashTxt}. Les autres lignes du budget se règlent dans l'onglet Finances, ouvert ce mois-ci.`,ch:[
  {l:`Baisser le taux de la taxe foncière`,e:{tx:-1,p:3},r:`La baisse est votée. {dgs} vous rappelle, sans sourire, qu'il faudra la financer.`},
  {l:`Maintenir le taux`,e:{p:0.5,e:1},r:`Budget voté sans surprise. {opp} s'abstient, par principe.`},
  {l:`Augmenter le taux`,e:{tx:1,p:-4,r:-1},r:`{opp} dénonce dans {journal} un « matraquage fiscal ». La trésorerie respire mieux.`}]},
 musique:{l:'fete',joy:1,t:'Fête de la musique',x:`Le 21 juin approche. Le comité des fêtes attend votre arbitrage pour la soirée.`,ch:[
  {l:`Une grande scène avec une tête d'affiche`,e:{m:-2,p:4,a:2},r:`Quatre mille personnes sur la place. Le dernier rappel s'achève à minuit pile, comme l'exigeait l'arrêté.`},
  {l:`Des scènes ouvertes pour les groupes du coin`,e:{m:-0.6,p:3,c:1},r:`Le groupe de rock du lycée joue devant ses parents, qui filment tout. Une chorale gospel fait danser la rue des Halles.`},
  {l:`Laisser les bars s'organiser`,e:{p:-1},r:`Trois enceintes devant trois bars. La soirée est animée, les riverains moins.`}]},
 juillet:{l:'fete',joy:1,t:'Le 14 Juillet',x:`Cérémonie au monument aux morts le matin, bal des pompiers le soir. Reste à choisir le spectacle de la nuit.`,ch:[
  {l:`Un feu d'artifice tiré depuis le stade`,e:{m:-2,p:3},r:`Dix-huit minutes de bouquets. Les chiens du quartier n'ont pas apprécié, tous les autres oui.`},
  {l:`Un spectacle de drones lumineux`,e:{m:-2.5,p:3,c:1,r:1},r:`Les drones dessinent le logo de la commune dans le ciel. La vidéo fait le tour des réseaux sociaux du département.`},
  {l:`Un grand pique-nique républicain`,e:{m:-0.8,p:2,c:1,e:1},r:`Huit cents personnes, des nappes à carreaux sur deux cents mètres et un concours de tartes que vous devez juger.`}]},
 rentree:{l:'ecole',t:'Rentrée scolaire',x:`L'inspection académique envisage de fermer une classe à l'école {ecole}. Les parents d'élèves ont accroché des banderoles aux grilles.`,ch:[
  {l:`Occuper l'école avec les parents, écharpe en bandoulière`,e:{r:3,e:-1},f:()=>Math.random()<0.55?{r:`Après dix jours de mobilisation, l'inspection renonce. La classe est sauvée et les banderoles restent accrochées, en souvenir.`,e:{p:5}}:{r:`La mobilisation est saluée, la décision maintenue. Les parents vous savent gré d'avoir essayé.`,e:{p:1}}},
  {l:`Négocier discrètement avec l'inspection`,e:{r:1},f:()=>Math.random()<0.4?{r:`La fermeture est repoussée d'un an. C'est déjà quelque chose.`,e:{p:2}}:{r:`La classe ferme. Les parents vous reprochent votre discrétion.`,e:{p:-2}}},
  {l:`Accepter la fermeture et réorganiser les locaux`,e:{p:-3,m:0.5},r:`La salle libérée devient une bibliothèque. Les parents ne décolèrent pas.`}]},
 noel:{l:'place',joy:1,t:'Le marché de Noël',x:`Décembre. Les guirlandes sont posées, le vin chaud est en commande. Il faut décider de l'ampleur du marché de Noël.`,ch:[
  {l:`Une patinoire éphémère sur la place`,e:{m:-3,p:4,a:2},r:`Les enfants tombent, se relèvent, recommencent. La patinoire affiche complet tous les week-ends.`},
  {l:`Vingt chalets réservés aux artisans du coin`,e:{m:-1,p:2,a:2,c:1},r:`Le stand de nougat est dévalisé le premier soir. On vient des communes voisines.`},
  {l:`Les illuminations, et c'est tout`,e:{m:-0.4,p:1},r:`Les illuminations sont jolies. Personne n'en dit davantage.`}]},
 campagne:{l:'place',t:'La campagne municipale',x:`Les élections municipales ont lieu en mars. {cab} a réservé la salle pour le meeting et vous demande de trancher l'axe de la campagne. En face, {opp} a déjà collé ses affiches.`,ch:[
  {l:`Défendre le bilan, chiffres à l'appui`,camp:'bilan',r:`Les tracts listent chaque chantier mené. {com} les distribue au marché trois samedis de suite.`},
  {l:`Faire du porte-à-porte dans chaque rue`,camp:'terrain',r:`Quatre semaines, des milliers de portes, deux paires de chaussures. On vous offre des cafés partout.`},
  {l:`Promettre un grand projet pour les six ans à venir`,camp:'projet',r:`La maquette du projet est exposée en mairie. Elle fait parler, en bien et en mal.`},
  {l:`Ne pas se représenter`,end:'retraite',r:``}]},
 inaug:{l:'inaug',joy:1,t:'Inauguration',x:`Le ruban tricolore est tendu, les ciseaux attendent sur un coussin de velours. Le sous-préfet, le conseiller départemental et une centaine d'habitants sont là.`,ch:[
  {l:`Couper le ruban et donner la parole aux ouvriers du chantier`,e:{p:2,e:2},r:`Le chef de chantier parle trois minutes, ému. C'est le meilleur discours de la journée.`},
  {l:`Discours, fanfare et buffet`,e:{p:3,m:-0.5,r:2},r:`La fanfare joue faux avec beaucoup d'enthousiasme. Le buffet est vidé en vingt minutes.`},
  {l:`Laisser les enfants de l'école couper le ruban`,e:{p:3,r:3},r:`La photo des enfants brandissant les ciseaux fait la une de {journal}.`}]},
 medecin2:{l:'inaug',joy:1,t:'La maison de santé ouvre',x:`Les travaux sont terminés. La maison de santé accueille ses premiers patients : deux médecins, deux infirmières, une kinésithérapeute et une sage-femme.`,ch:[
  {l:`Visiter les lieux avec la presse`,e:{p:4,r:3,c:2},r:`La photo des soignants devant la porte fait la une de {journal}.`},
  {l:`Passer saluer l'équipe, sans caméra`,e:{p:3,c:2,e:1},r:`Les soignants apprécient la visite discrète. L'une d'elles vous propose un rendez-vous de contrôle.`}]},
 scandale:{l:'presse',t:'L’affaire sort',x:`{journal} publie une enquête sur le marché de voirie attribué au beau-frère d'un élu de votre majorité. L'article affirme que vous étiez au courant.`,ch:[
  {l:`Tout reconnaître et présenter des excuses`,e:{p:-5,r:-1,e:-1},r:`L'aveu coûte cher, mais l'affaire s'éteint en quelques semaines.`},
  {l:`Nier en bloc`,f:()=>Math.random()<0.35?{r:`Faute de preuve écrite, l'affaire retombe. Une partie de la ville n'en pense pas moins.`,e:{p:-2,r:-2}}:{r:`Le journal publie un courriel qui vous contredit. L'opposition demande votre démission.`,e:{p:-10,r:-7,e:-4}}}]},
 crc:{l:'prefecture',t:'La chambre régionale des comptes',x:`La trésorerie est lourdement dans le rouge ({cashTxt}). Le préfet saisit la chambre régionale des comptes, qui exige un plan de redressement.`,ch:[
  {l:`Augmenter la taxe foncière`,e:{tx:1,p:-5,m:5},r:`Le plan est validé. La hausse figure en gras sur les avis d'imposition de l'automne.`},
  {l:`Un plan d'économies sévère`,e:{e:-4,c:-2,m:7},r:`Horaires de la piscine réduits, subventions aux associations rabotées. Les comptes se redressent.`},
  {l:`Vendre une partie du patrimoine communal`,e:{m:9,p:-2,a:-1},r:`L'ancienne gendarmerie et deux terrains sont cédés. {opp} parle de « vente des bijoux de famille ».`}]},
 fronde:{l:'conseil',t:'La fronde',x:`Six élus de votre majorité menacent de voter contre le prochain budget. Votre popularité est au plus bas et {journal} évoque déjà votre succession.`,ch:[
  {l:`Remanier l'exécutif et reprendre la main`,e:{e:4,p:5},r:`Deux adjoints perdent leur délégation, trois frondeurs en gagnent une. Le calme revient, provisoirement.`},
  {l:`Tenir bon, sans rien céder`,e:{e:-3,p:1},r:`Le budget passe à deux voix près. L'ambiance au conseil reste glaciale.`},
  {l:`Démissionner`,end:'demission',r:``}]},
};
const POOL=[
 {id:'lampadaires',l:'quartier',t:'L’éclairage de nuit',x:`Une pétition de quarante signatures arrive en mairie : les habitants de la rue des Tilleuls veulent que les lampadaires restent allumés toute la nuit. Votre {dgsR}, {dgs}, rappelle que l'extinction entre 23 h et 5 h allège nettement la facture d'électricité.`,ch:[
  {l:`Maintenir l'extinction nocturne`,e:{m:0.8,p:-2,c:2},r:`Les économies restent acquises. La rue des Tilleuls, elle, reste fâchée.`},
  {l:`Rallumer la rue des Tilleuls`,e:{m:-0.6,p:2},r:`Les pétitionnaires vous remercient par courrier. Deux autres rues préparent déjà leur pétition.`},
  {l:`Poser des lampadaires à détection de présence`,e:{m:-3,p:1,c:2,a:1},r:`La lumière s'allume au passage des promeneurs de chiens, ce qui ravit tout le monde.`}]},
 {id:'boulangerie',l:'place',cond:()=>pop()<8000,t:'La dernière boulangerie',x:`Monique et Gérard prennent leur retraite. Sans repreneur, la boulangerie du centre fermera à la fin du mois, et avec elle le seul commerce ouvert le dimanche matin.`,ch:[
  {l:`Racheter le fonds et le louer à prix réduit à un jeune artisan`,e:{m:-5,a:4,p:3},r:`Une boulangère de vingt-sept ans signe le bail. Le pain au levain est épuisé chaque jour avant midi.`},
  {l:`Organiser un dépôt de pain au café-tabac`,e:{m:-0.5,a:1,p:-1},r:`La solution dépanne. Personne n'est content, personne n'est furieux.`},
  {l:`Laisser faire`,e:{a:-3,p:-3},r:`Le rideau de fer se baisse. Le dimanche matin, la place est silencieuse.`}]},
 {id:'medecin',l:'bureau',t:'Le médecin s’en va',x:`Le docteur Lemaire part à la retraite cet été. Il suit près d'un tiers des habitants et n'a trouvé personne pour lui succéder. {adj} vous presse d'agir.`,ch:[
  {l:`Lancer une maison de santé pluridisciplinaire`,e:{m:-6,c:2,p:1},later:['medecin2',8,1],r:`Le projet est inscrit au budget. Deux infirmières et une kinésithérapeute se disent intéressées.`},
  {l:`Financer logement et cabinet pour attirer un jeune médecin`,e:{m:-2,a:1},f:()=>Math.random()<0.55?{r:`Une généraliste originaire de la région accepte de s'installer. Le soulagement est général.`,e:{p:4,c:3}}:{r:`L'annonce reste sans réponse pendant six mois. Les patients prennent la route de la ville voisine.`,e:{p:-3}}},
  {l:`Interpeller l'agence régionale de santé et attendre`,e:{r:1,p:-3},r:`L'agence répond par un courrier aimable. Le cabinet ferme en août.`}]},
 {id:'promoteur',l:'bureau',cond:()=>pop()>1500,t:'La friche de la gare',x:`Un promoteur propose de construire {logts} logements sur l'ancienne friche de la gare. Le dossier est solide, les riverains beaucoup moins enthousiastes.`,ch:[
  {l:`Accepter le projet tel quel`,e:{a:4,c:-2,m:3,p:-2},r:`Les grues arrivent à l'automne. La taxe d'aménagement remplit un peu les caisses.`},
  {l:`Exiger 30 % de logements sociaux et un jardin public`,e:{a:2,c:2,m:1,e:-1},r:`Le promoteur grimace, puis signe. {opp} parle d'un « compromis honorable », ce qui est presque un compliment.`},
  {l:`Refuser et garder la friche`,e:{a:-2,c:1,p:1},r:`La friche reste une friche. Les herbes folles s'en réjouissent.`}]},
 {id:'solaire',l:'chantier',t:'Des panneaux sur l’ancienne décharge',x:`Une société d'énergie propose d'installer une centrale solaire sur le terrain de l'ancienne décharge municipale, contre un loyer versé à la commune pendant trente ans.`,ch:[
  {l:`Signer le bail`,e:{c:2,a:1},f:()=>{S.recur+=0.2;return{r:`La centrale est raccordée au printemps. Le loyer tombe chaque mois.`};}},
  {l:`Monter une société citoyenne avec les habitants`,e:{m:-2,c:3,p:2,e:1},f:()=>{S.recur+=0.3;return{r:`Trois cents habitants prennent des parts. L'assemblée générale se tient dans la salle des fêtes, et l'on y vote à main levée.`};}},
  {l:`Décliner`,e:{c:-1},r:`Le dossier part chez la commune voisine.`}]},
 {id:'interco',l:'prefecture',t:'L’eau et l’intercommunalité',x:`Le président de la {interco} souhaite que la gestion de l'eau soit confiée à l'échelon intercommunal. Les élus de votre majorité sont partagés.`,ch:[
  {l:`Accepter le transfert`,e:{m:2,p:-1,e:-1},r:`Le transfert est voté. Les factures d'eau changent d'en-tête, et rien d'autre pour l'instant.`},
  {l:`Défendre la régie municipale`,e:{m:-1,p:2,r:1},r:`Vous tenez bon. Le président de l'intercommunalité vous salue désormais moins chaleureusement.`},
  {l:`Négocier un calendrier sur trois ans`,e:{m:1,e:1},r:`Le compromis ne déplaît à personne, ce qui en politique tient du succès.`}]},
 {id:'tags',l:'quartier',t:'Des tags sur le gymnase',x:`Un matin, la façade du gymnase est couverte de tags. Les photos circulent déjà sur le groupe Facebook « Tu es {deVille} si… ».`,ch:[
  {l:`Nettoyer et commander une fresque aux jeunes du quartier`,e:{m:-1,c:2,p:2,r:1},r:`La fresque est inaugurée en juin. Elle n'a plus été taguée.`},
  {l:`Installer des caméras de vidéoprotection`,e:{m:-3,p:1,c:-1},r:`Les caméras sont posées. {opp} réclame un bilan chiffré, qu'il attend toujours.`},
  {l:`Nettoyer et porter plainte`,e:{m:-0.4},r:`La façade reste propre trois semaines.`}]},
 {id:'centenaire',l:'salle',joy:1,t:'Cent ans',x:`Madame {vieille} fête ses cent ans à la résidence pour personnes âgées. Elle est née en {an100}, l'année où son père ouvrait la quincaillerie de la Grand-Rue. Sa famille vous invite.`,ch:[
  {l:`Venir avec un bouquet et la copie de son acte de naissance`,e:{p:2,r:2},r:`Elle vous raconte la crue de son enfance et vous corrige sur le nom d'une rue. Elle a raison.`},
  {l:`Envoyer des fleurs et une carte`,e:{p:0.5},r:`La carte trône sur la table de nuit, à côté de celle du préfet.`}]},
 {id:'tournage',l:'place',joy:1,t:'Silence, on tourne',x:`Une société de production souhaite tourner trois jours sur la place de la mairie pour un téléfilm policier. Il faudrait fermer la place et déplacer le marché.`,ch:[
  {l:`Accepter et recruter des figurants parmi les habitants`,e:{m:1,a:2,p:2},r:`Cent douze habitants s'inscrivent comme figurants. Le boucher obtient une réplique, qu'il répète depuis à ses clients.`},
  {l:`Accepter sans déplacer le marché`,e:{m:0.5,a:1},r:`L'équipe tourne entre les étals. Le réalisateur trouve cela très authentique.`},
  {l:`Refuser`,e:{p:-1},r:`Le tournage part chez le voisin, qui ne manque pas de le faire savoir.`}]},
 {id:'viral',l:'presse',t:'La vidéo qui tourne',x:`Une vidéo vous montre glissant sur une plaque de verglas devant l'école. Elle cumule deux cent mille vues. Votre {comR}, {com}, attend vos consignes.`,ch:[
  {l:`Répondre par l'autodérision et annoncer un plan de salage`,e:{r:4,p:2},r:`Votre réponse fait plus de vues que la chute. Le sel est livré le lendemain.`},
  {l:`Ne rien dire`,e:{r:-1},r:`La vidéo est oubliée en dix jours.`},
  {l:`Demander son retrait`,e:{r:-4,p:-2},r:`L'affaire devient « la vidéo que la mairie veut cacher ». Huit cent mille vues.`}]},
 {id:'cantine',l:'ecole',t:'Grève à la cantine',x:`Les agents de restauration scolaire se mettent en grève : ils réclament deux postes supplémentaires et dénoncent des cadences intenables. Les enfants mangent des sandwichs depuis lundi.`,ch:[
  {l:`Recruter deux agents`,e:{m:-2,e:2,p:2},r:`La grève est levée le soir même. Les frites reviennent le vendredi.`},
  {l:`Proposer une prime ponctuelle`,e:{m:-0.8,e:1,p:-1},r:`La grève s'arrête. Le problème de fond, lui, reste entier.`},
  {l:`Ne rien céder`,e:{e:-3,p:-3,r:-1},r:`La grève dure trois semaines. Les parents d'élèves écrivent à {journal}.`}]},
 {id:'coq',l:'quartier',cond:()=>pop()<6000,t:'L’affaire du coq',x:`Un couple installé depuis peu demande que le coq de monsieur {coqman} cesse de chanter avant huit heures. Le coq n'a rien demandé à personne.`,ch:[
  {l:`Prendre publiquement la défense du coq`,e:{p:3,r:3},r:`{journal} titre sur le « maire qui défend le patrimoine sonore des campagnes ». Le coq continue.`},
  {l:`Organiser une médiation autour d'un café`,e:{p:1,e:1},r:`Le couple repart avec une douzaine d'œufs. La paix est signée.`},
  {l:`Demander que le coq soit rentré la nuit`,e:{p:-2},r:`Monsieur {coqman} refuse. Le coq aussi.`}]},
 {id:'fleuris',l:'place',joy:1,t:'Le jury des villes fleuries',x:`Le jury régional du label des villes et villages fleuris passe dans un mois. Les jardiniers municipaux ont déjà des idées.`,ch:[
  {l:`Miser sur les vivaces et zéro pesticide`,e:{m:-1,c:3},f:()=>Math.random()<0.5?{r:`Le jury décerne une fleur de plus. Les jardiniers posent pour la photo, fourches à la main.`,e:{p:3,a:2}}:{r:`Le jury salue la démarche, mais ne décerne rien cette année.`}},
  {l:`Commander des massifs spectaculaires`,e:{m:-2,c:1,p:1},r:`Les massifs sont superbes jusqu'en août.`},
  {l:`Ne pas concourir cette année`,e:{e:-1},r:`Les jardiniers sont déçus et le disent.`}]},
 {id:'jumelage',l:'salle',joy:1,t:'Une proposition de jumelage',x:`Une commune autrichienne de taille comparable propose un jumelage. Le comité des fêtes rêve déjà d'échanges scolaires et d'une fanfare commune.`,ch:[
  {l:`Signer et organiser la cérémonie`,e:{m:-1,p:2,a:2},r:`La délégation arrive en car. On échange des fanions, des recettes et quelques adresses.`},
  {l:`Accepter un jumelage sans frais`,e:{a:1},r:`La convention est signée par courrier.`},
  {l:`Décliner poliment`,e:{},r:`La lettre de refus est d'une grande courtoisie.`}]},
 {id:'secheresse',l:'prefecture',cond:()=>mi()>=5&&mi()<=8,t:'Sécheresse',x:`Le préfet place le département en alerte sécheresse renforcée. Arrosage des pelouses et lavage des voitures sont interdits. Le terrain du {club} jaunit.`,ch:[
  {l:`Appliquer l'arrêté à la lettre, stade compris`,e:{c:2,p:-1,r:1},r:`Le terrain devient paillasson. L'entraîneur du {club} vous en veut.`},
  {l:`Équiper les bâtiments communaux pour récupérer l'eau de pluie`,e:{m:-2,c:3},r:`Les cuves sont posées avant l'automne.`},
  {l:`Demander une dérogation pour le stade`,e:{p:1,c:-2,r:-2},r:`{journal} publie la photo du stade arrosé à côté d'un potager desséché.`}]},
 {id:'amendements',l:'conseil',t:'Quarante amendements',x:`{opp}, chef de file de l'opposition, dépose quarante amendements sur une simple délibération. La séance risque de durer jusqu'à deux heures du matin.`,ch:[
  {l:`Les examiner un par un`,e:{e:-1,r:2,p:1},r:`La séance s'achève à 1 h 47. Trois amendements sont adoptés, et {opp} salue votre patience.`},
  {l:`Faire voter en bloc grâce à votre majorité`,e:{e:1,r:-2},r:`Vingt minutes et l'affaire est réglée. {opp} dénonce dans {journal} un « déni de démocratie ».`},
  {l:`Renvoyer le tout en commission`,e:{e:1,p:1},r:`La commission se réunit deux fois. Les amendements y meurent paisiblement.`}]},
 {id:'supermarche',l:'bureau',cond:()=>pop()>1500&&pop()<60000,t:'Un hypermarché en périphérie',x:`Une enseigne de grande distribution veut s'installer en entrée de ville, sur huit hectares de terres agricoles. Elle promet quatre-vingts emplois. Les commerçants du centre s'inquiètent.`,ch:[
  {l:`Donner un avis favorable`,e:{a:3,m:2,c:-3,p:-1},r:`Les emplois arrivent. Deux boutiques du centre ferment dans l'année.`},
  {l:`S'y opposer pour défendre le centre-ville`,e:{a:-1,c:2,p:2},r:`Les commerçants vous remercient d'une affichette en vitrine. L'enseigne part chez le voisin.`},
  {l:`Proposer une friche plutôt que les terres agricoles`,e:{a:2,c:1,e:-1},r:`L'enseigne accepte après six mois de négociation. Le maire voisin, qui espérait l'accueillir, ne vous parle plus.`}]},
 {id:'retard',l:'chantier',t:'La Grand-Rue en travaux',x:`Les travaux de voirie de la Grand-Rue ont trois mois de retard. Les commerçants disent avoir perdu un tiers de leur chiffre d'affaires.`,ch:[
  {l:`Indemniser les commerçants`,e:{m:-2,p:2,a:1},r:`Une commission d'indemnisation est créée. Les dossiers sont traités avant Noël.`},
  {l:`Appliquer les pénalités de retard à l'entreprise`,e:{m:1,r:1},r:`L'entreprise double ses équipes. Le chantier ne finit plus qu'avec un mois de retard.`},
  {l:`Organiser des animations pour attirer les clients`,e:{m:-0.5,p:1},r:`Une fanfare joue entre deux tranchées.`}]},
 {id:'legs',l:'quartier',joy:1,t:'Une maison léguée',x:`Monsieur {vieux}, mort sans héritier à quatre-vingt-quinze ans, a légué sa maison à la commune. Une bâtisse de 1890, un jardin, un piano droit.`,ch:[
  {l:`En faire une maison des associations`,e:{m:-2,p:2,c:2},r:`Le piano est accordé. Une chorale s'y installe le mardi soir.`},
  {l:`La transformer en logements d'urgence`,e:{m:-2,c:3,r:2},r:`Deux familles y sont hébergées dès l'hiver.`},
  {l:`La vendre`,e:{m:4,p:-1},r:`La maison est vendue à un couple de Lyonnais. Le piano part aux enchères.`}]},
 {id:'tv',l:'presse',t:'Sur le plateau',x:`La télévision régionale vous invite au journal du soir pour parler {deVille}. Quatre minutes en direct.`,ch:[
  {l:`Parler du projet phare du mandat`,e:{r:3,a:2},r:`Quatre minutes passent très vite. On vous reconnaît le lendemain à la boulangerie.`},
  {l:`Défendre les petites communes face à l'État`,e:{r:2,p:2},r:`Plusieurs maires du département vous envoient un message de soutien.`},
  {l:`Envoyer {com} à votre place`,e:{r:-1,e:1},r:`{com} s'en sort bien. On se demande quand même où était le maire.`}]},
 {id:'signalement',l:'bureau',t:'Un signalement',x:`Un agent des services techniques demande à vous voir, porte fermée. Selon lui, un conseiller municipal de votre majorité aurait orienté un marché de voirie vers l'entreprise de son beau-frère.`,ch:[
  {l:`Saisir le procureur de la République`,e:{e:-3,r:2,p:1},r:`La justice est saisie. Le conseiller rend sa délégation. {journal} salue votre transparence.`},
  {l:`Régler l'affaire en interne, discrètement`,e:{e:1},later:['scandale',5,0.55],r:`Le conseiller rend sa délégation sans bruit. Pour l'instant.`},
  {l:`Classer le signalement`,later:['scandale',4,0.9],r:`L'agent repart sans un mot.`}]},
 {id:'canicule',l:'quartier',cond:()=>mi()>=5&&mi()<=7,t:'Canicule',x:`Le département passe en vigilance orange canicule. Le registre des personnes vulnérables de la commune compte {vuln} inscrits.`,ch:[
  {l:`Faire appeler chaque inscrit tous les jours`,e:{e:-1,c:2,p:3},r:`Chaque matin, les appels commencent à neuf heures. Personne n'est oublié.`},
  {l:`Ouvrir une salle rafraîchie et prolonger les horaires de baignade`,e:{m:-1,p:2,c:1},r:`La salle accueille une trentaine de personnes par jour, surtout pour la belote.`},
  {l:`S'en tenir au plan minimal`,e:{p:-2},r:`{opp} vous reproche de ne pas en avoir fait davantage.`}]},
 {id:'neige',l:'quartier',cond:()=>(mi()>=11||mi()<=1)&&(S.ville.geo==='montagne'||Math.random()<0.4),t:'Trente centimètres de neige',x:`Il a neigé toute la nuit. Les cars scolaires ne passent plus et les services techniques ne disposent que de deux lames.`,ch:[
  {l:`Heures supplémentaires pour déneiger toutes les rues`,e:{m:-1.5,p:3,e:-1},r:`À midi, la commune est praticable. Les agents n'ont pas dormi.`},
  {l:`Faire appel aux agriculteurs équipés de lames`,e:{m:-0.5,p:2,e:1},r:`Six tracteurs sortent des fermes. On les applaudit au passage.`},
  {l:`Dégager seulement les grands axes`,e:{p:-1},r:`Les rues secondaires restent blanches trois jours. Les enfants sont ravis, les parents moins.`}]},
 {id:'course',l:'stade',joy:1,cond:()=>pop()>2000,t:'Les foulées {deVille}',x:`Le club d'athlétisme propose de créer une course de dix kilomètres dans les rues de la ville, au profit de la recherche médicale.`,ch:[
  {l:`Accepter et courir soi-même les dix kilomètres`,f:()=>{const mn=RI(44,68);return{r:`Vous franchissez la ligne en ${mn} minutes. Huit cents coureurs, et un chèque remis à la recherche.`,e:{p:3,r:2,a:1}};}},
  {l:`Accepter et donner le départ`,e:{p:2,a:1},r:`Le pistolet du starter fonctionne du premier coup, ce qui n'était pas gagné.`},
  {l:`Refuser, trop de rues à fermer`,e:{p:-1},r:`Le club d'athlétisme organise sa course dans la commune voisine.`}]},
 {id:'fibre',l:'bureau',t:'La fibre',x:`L'opérateur propose d'accélérer le raccordement de quatre cents logements encore mal desservis, si la commune finance une partie des travaux de génie civil.`,ch:[
  {l:`Payer la part demandée`,e:{m:-3,a:4,p:1},r:`Les fourreaux sont posés en deux mois. Les télétravailleurs vous écrivent des lettres de remerciement.`},
  {l:`Attendre le calendrier normal`,e:{a:-1},r:`Le raccordement est prévu « dans les dix-huit mois ».`},
  {l:`Interpeller le conseil départemental`,e:{r:1},f:()=>Math.random()<0.5?{r:`Le département prend la moitié des frais à sa charge.`,e:{a:2,m:-1}}:{r:`Le département renvoie vers l'opérateur, qui renvoie vers le département.`}}]},
 {id:'poste',l:'place',t:'Le bureau de poste',x:`La Poste annonce la fermeture du bureau de la rue de la République, faute de fréquentation suffisante.`,ch:[
  {l:`Ouvrir une agence postale communale en mairie`,e:{m:-1,p:2,c:1},r:`L'agence s'installe au rez-de-chaussée de la mairie. Les horaires sont même plus larges qu'avant.`},
  {l:`Accepter un relais chez un commerçant`,e:{a:1},r:`Le buraliste reçoit les colis entre deux jeux à gratter.`},
  {l:`Lancer une pétition`,e:{r:2},f:()=>Math.random()<0.3?{r:`Deux mille signatures. Le bureau est maintenu, avec des horaires réduits.`,e:{p:3}}:{r:`Deux mille signatures, et le bureau ferme quand même.`,e:{p:-1}}}]},
 {id:'derby',l:'stade',joy:1,t:'Le derby',x:`Le {club} reçoit son grand rival. Le président du club vous a réservé une place en tribune d'honneur.`,ch:[
  {l:`Aller en tribune, écharpe du club au cou`,f:()=>matchRes(3)},
  {l:`Donner le coup d'envoi fictif`,f:()=>matchRes(2)},
  {l:`Rester au bureau`,e:{e:1,p:-1},r:`Vous suivez le score sur votre téléphone. Le président du club l'a remarqué.`}]},
 {id:'concert',l:'fete',joy:1,cond:()=>pop()>2000,t:'Un enfant du pays',x:`Un chanteur né {deVille}, désormais connu dans tout le pays, propose un concert gratuit sur la place pour ses vingt ans de carrière. La commune doit assurer la scène et la sécurité.`,ch:[
  {l:`Accepter et tout organiser`,e:{m:-2.5,p:5,a:3,r:2},r:`Dix mille personnes. Il dédie une chanson à son ancienne institutrice, présente au premier rang.`},
  {l:`Accepter en demandant l'aide du département`,e:{m:-1,p:4,a:2,e:-1},r:`Le département paie la moitié et place son logo en grand sur la scène.`},
  {l:`Refuser`,e:{p:-3},r:`Le chanteur se produit ailleurs et raconte l'histoire en interview.`}]},
 {id:'tracteurs',l:'place',cond:()=>pop()<40000,t:'Les tracteurs sur le rond-point',x:`Une trentaine d'agriculteurs bloquent le rond-point d'entrée de ville avec tracteurs et bottes de paille. Ils protestent contre les normes et les prix d'achat.`,ch:[
  {l:`Aller les voir avec du café`,e:{p:2,r:2},r:`Vous restez deux heures. On vous explique le prix du lait au litre, chiffres à l'appui.`},
  {l:`Porter leurs revendications au préfet`,e:{p:2,e:-1,r:1},r:`Le préfet vous reçoit, prend des notes et promet de transmettre.`},
  {l:`Demander la levée du blocage`,e:{p:-2},r:`Le blocage est levé deux jours plus tard. On vous le fait payer au marché.`}]},
 {id:'grandfroid',l:'salle',cond:()=>mi()>=10||mi()<=2,t:'Grand froid',x:`Le plan grand froid est déclenché. La préfecture demande si la commune peut ouvrir un gymnase pour une quarantaine de personnes sans abri pendant deux semaines.`,ch:[
  {l:`Ouvrir le gymnase`,e:{m:-1,c:2,r:2,p:-1},r:`Des bénévoles servent la soupe chaque soir. Les clubs de sport s'entraînent ailleurs, en râlant un peu.`},
  {l:`Proposer une salle plus petite`,e:{c:1},r:`Vingt places au lieu de quarante. La préfecture complète avec une autre commune.`},
  {l:`Refuser`,e:{r:-2,c:-1},r:`La préfecture prend acte. {journal} aussi.`}]},
 {id:'police',l:'conseil',cond:()=>pop()>5000,t:'La police municipale',x:`Les agents de la police municipale demandent des renforts et des patrouilles de nuit. {opp} réclame davantage de moyens.`,ch:[
  {l:`Recruter trois agents`,e:{m:-2,p:2,c:1},r:`Les patrouilles de nuit commencent au printemps.`},
  {l:`Embaucher des médiateurs de rue`,e:{m:-1.5,c:2,e:1},r:`Les médiateurs connaissent les jeunes par leur prénom. Les incivilités baissent dans deux quartiers.`},
  {l:`Garder les effectifs actuels`,e:{p:-1},r:`Les agents font grise mine.`}]},
 {id:'froid',l:'bureau',t:'Froid dans l’équipe',x:`{cab} et {com} ne se parlent plus depuis l'affaire des cartons d'invitation, envoyés avec une faute dans le nom du sous-préfet.`,ch:[
  {l:`Réunion de crise dans votre bureau`,e:{e:4},r:`Une heure d'explications, puis un café. Ils se reparlent, prudemment.`},
  {l:`Trancher en faveur de {cab}`,e:{e:-1},r:`{com} encaisse sans rien dire. On sent que cela ressortira.`},
  {l:`Laisser décanter`,e:{e:-4},r:`Les réunions d'équipe se déroulent désormais dans un silence pesant.`}]},
 {id:'demission',l:'bureau',cond:()=>S.st.e<40,t:'Une lettre sur le bureau',x:`{adj} dépose une lettre de démission sur votre bureau. Trop de réunions, pas assez de reconnaissance, dit-on dans les couloirs.`,ch:[
  {l:`Lui confier une délégation de plus`,e:{e:5,m:-0.3},r:`La lettre retourne dans un tiroir.`},
  {l:`L'inviter à dîner pour en parler`,f:()=>Math.random()<0.6?{r:`Le dîner dure trois heures. {adj} reste.`,e:{e:4}}:{r:`Le dîner est cordial. La démission est maintenue.`,e:{e:-3,p:-1}}},
  {l:`Accepter la démission`,e:{e:-3,p:-1},r:`Un nouvel adjoint est élu au conseil suivant. {opp} parle de « débandade ».`}]},
 {id:'festival',l:'fete',joy:1,t:'Un festival à créer',x:`L'association des amis de la médiathèque propose un festival du livre jeunesse sur deux jours, avec une dizaine d'autrices et d'auteurs invités.`,ch:[
  {l:`Soutenir largement le projet`,e:{m:-1.5,p:3,a:2,c:1},r:`Trois mille visiteurs pour la première édition. Les écoles réservent déjà pour l'an prochain.`},
  {l:`Une subvention modeste`,e:{m:-0.5,p:1},r:`L'édition est plus modeste, mais elle a lieu.`},
  {l:`Refuser`,e:{p:-1},r:`L'association range son dossier, pour l'instant.`}]},
 {id:'usine',l:'chantier',t:'L’usine Duroc',x:`L'ancienne usine textile Duroc, fermée depuis 2009, est mise en vente. Quatre mille mètres carrés de briques et de verrières, en plein centre.`,ch:[
  {l:`La racheter pour en faire un tiers-lieu`,e:{m:-6,a:3,c:2,p:1},r:`Ateliers d'artistes, espace de travail partagé, café associatif. Les verrières sont nettoyées pour la première fois depuis quinze ans.`},
  {l:`Laisser un investisseur privé l'acheter`,e:{a:1},r:`L'usine devient un entrepôt logistique.`},
  {l:`Y faire construire des logements avec un bailleur`,e:{a:2,c:1,m:-1},r:`Soixante logements dans les murs de briques. La cheminée est conservée.`}]},
 {id:'platane',l:'place',t:'Le grand platane',x:`Le platane bicentenaire de la place est atteint d'un champignon. Un expert recommande l'abattage, une pétition demande qu'on le sauve.`,ch:[
  {l:`Abattre et replanter trois jeunes arbres`,e:{c:-1,p:-2},r:`Le jour de l'abattage, une centaine d'habitants viennent assister à la chute.`},
  {l:`Tenter de le soigner`,e:{m:-1,c:1,p:2},f:()=>Math.random()<0.5?{r:`Le traitement prend. Le platane reverdit au printemps.`}:{r:`Le traitement échoue. Il faudra l'abattre l'an prochain, mais vous aurez essayé.`}},
  {l:`L'abattre et faire sculpter la souche`,e:{m:-0.6,p:1},r:`Un sculpteur en tire une chouette de deux mètres. Les enfants grimpent dessus.`}]},
 {id:'emission',l:'presse',t:'« Le maire vous répond »',x:`{com} propose de lancer une émission mensuelle en direct sur les réseaux sociaux, où vous répondriez aux questions des habitants.`,ch:[
  {l:`Oui, en direct`,e:{r:3,p:1,m:-0.2},r:`Premier numéro : quarante questions, dont douze sur les crottes de chien.`},
  {l:`Oui, mais préenregistrée`,e:{r:1},r:`L'émission est soignée et un peu raide.`},
  {l:`Non`,e:{e:-1},r:`{com} range le micro qu'il ou elle avait déjà acheté.`}]},
 {id:'plu',l:'conseil',cond:()=>pop()>1000,t:'Le plan local d’urbanisme',x:`La révision du plan local d'urbanisme arrive au conseil. Il faut choisir entre construire davantage et protéger les terres agricoles autour de la commune.`,ch:[
  {l:`Ouvrir de nouvelles zones à la construction`,e:{a:3,c:-2,m:1},r:`Les agences immobilières se frottent les mains.`},
  {l:`Protéger les terres agricoles et densifier le centre`,e:{c:3,a:-1},r:`Les agriculteurs saluent la décision. Quelques propriétaires de terrains, beaucoup moins.`},
  {l:`Un compromis négocié quartier par quartier`,e:{a:1,c:1,e:-1},r:`Six mois de réunions publiques. Le compromis est adopté à une large majorité.`}]},
 {id:'bar',l:'quartier',t:'Musique au {bar}',x:`Les riverains du bar Le {bar} se plaignent : des concerts jusqu'à une heure du matin, trois fois par semaine.`,ch:[
  {l:`Prendre un arrêté limitant les horaires`,e:{p:-1,c:1},r:`Les concerts s'arrêtent à 23 heures. Le patron fait la tête.`},
  {l:`Une médiation : concerts le vendredi uniquement`,e:{p:1,e:1},r:`Tout le monde signe. Le vendredi devient le soir le plus couru de la ville.`},
  {l:`Laisser vivre le quartier`,e:{a:1,c:-2},r:`Les riverains écrivent au préfet.`}]},
 {id:'mariage',l:'mariage',joy:1,t:'Un mariage à la mairie',x:`Samedi, vous célébrez le mariage de Léa, agente d'accueil à la mairie depuis dix ans, et de Malik, pompier volontaire. La salle des mariages est pleine.`,ch:[
  {l:`Célébrer avec un discours personnel`,e:{p:2,e:3},r:`Vous racontez comment Léa a un jour retrouvé l'alliance perdue d'un administré dans la boîte aux lettres. La salle rit, puis pleure.`},
  {l:`Célébrer en suivant le protocole`,e:{e:1},r:`Les articles du Code civil sont lus sans une erreur. Les mariés sont heureux.`},
  {l:`Déléguer à un adjoint`,e:{e:-1},r:`Léa aurait aimé que ce soit vous.`}]},
 {id:'legislatives',l:'presse',press:1,t:'Une question piège',x:`Un journaliste de {journal} vous tend son micro : serez-vous candidat{e} aux prochaines élections législatives ?`,ch:[
  {l:`Démentir fermement`,e:{p:2},r:`« Je suis maire et je le reste. » La phrase est reprise en titre.`},
  {l:`Laisser planer le doute`,e:{r:2,p:-1,e:-1},r:`Les spéculations vont bon train. {cab} reçoit trois appels de la fédération.`},
  {l:`Sourire et parler du marché de Noël`,e:{r:-1},r:`Le journaliste n'est pas dupe.`}]},
 {id:'finances',l:'presse',press:1,t:'L’état des finances',x:`{journal} prépare un dossier sur les finances des communes du département et vous demande un entretien. Trésorerie actuelle : {cashTxt}.`,ch:[
  {l:`Tout montrer, tableaux compris`,e:{r:3,p:-1},r:`L'article est sévère mais juste. On salue votre transparence.`},
  {l:`Insister sur les bonnes nouvelles`,e:{r:-1,p:1},r:`L'article cite vos chiffres, puis ceux de l'opposition, qui ne sont pas les mêmes.`},
  {l:`Refuser l'entretien`,e:{r:-3},r:`Le dossier paraît avec la mention « le maire n'a pas souhaité répondre ».`}]},
 {id:'portrait',l:'presse',press:1,joy:1,t:'Le portrait',x:`{journal} consacre sa dernière page à un portrait de vous. La journaliste veut vous suivre une journée entière.`,ch:[
  {l:`Accepter, du marché du matin au conseil du soir`,e:{r:3,p:2},r:`Le portrait est tendre. On y apprend que vous prenez votre café sans sucre et que vous saluez tout le monde.`},
  {l:`Accepter un entretien d'une heure seulement`,e:{r:1},r:`Le portrait est court et correct.`},
  {l:`Refuser`,e:{r:-1},r:`Le journal publie le portrait de {opp} à la place.`}]}
, {id:'assesseurs',l:'salle',t:'Il manque des assesseurs',x:`Une élection nationale a lieu dimanche. Chaque bureau de vote doit avoir son président et ses assesseurs, et il manque encore six volontaires pour tenir les bureaux {deVille}.`,ch:[
  {l:`Mobiliser tous les élus du conseil`,e:{e:-1,r:1},r:`Les conseillers municipaux tiennent les bureaux de huit heures au dépouillement. Les procès-verbaux partent à la préfecture sans une rature.`},
  {l:`Lancer un appel aux habitants`,e:{p:2,c:1},r:`Des étudiants tout juste majeurs se portent volontaires. L'un d'eux vote pour la première fois et préside son bureau l'après-midi.`},
  {l:`Tenir vous-même le bureau le plus chargé`,e:{p:1,e:1},r:`Vous surveillez la liste d'émargement onze heures durant. On vous apporte un sandwich vers quatorze heures.`}]},
 {id:'antenne',l:'quartier',t:'Une antenne-relais',x:`Un opérateur veut implanter une antenne-relais de trente mètres près du lotissement des Érables. Les riverains s'inquiètent, les télétravailleurs du secteur réclament du réseau.`,ch:[
  {l:`Laisser le projet suivre son cours`,e:{a:2,p:-2},r:`L'antenne est montée en octobre. Les barres de réseau apparaissent, les pétitions aussi.`},
  {l:`Négocier un autre emplacement avec l'opérateur`,e:{a:1,c:1,e:-1},r:`L'antenne s'installe près du château d'eau, à l'écart des maisons. Il a fallu quatre réunions.`},
  {l:`Organiser une réunion publique d'information`,e:{r:1,p:1},r:`La salle est pleine. Les questions fusent, les réponses aussi, et la tension retombe un peu.`}]},
 {id:'peril',l:'quartier',t:'Un immeuble menace',x:`Des fissures béantes sont apparues sur un immeuble de la rue Basse. L'expert est formel : risque d'effondrement. Huit familles y vivent et le propriétaire ne répond plus.`,ch:[
  {l:`Prendre un arrêté d'évacuation et reloger les familles`,e:{m:-2,c:2,p:1},r:`Les familles dorment le soir même à l'hôtel, puis dans des logements du bailleur social. L'immeuble est étayé.`},
  {l:`Faire les travaux d'office, aux frais du propriétaire`,e:{m:-3,c:2},f:()=>Math.random()<0.6?{r:`Les travaux sont faits, la commune récupère les sommes avancées un an plus tard.`,e:{m:2.5,p:1}}:{r:`Les travaux sont faits. Le propriétaire est introuvable, la commune en sera de sa poche.`}},
  {l:`Attendre une contre-expertise`,f:()=>Math.random()<0.3?{r:`Un pan de façade s'effondre une nuit de pluie. Personne n'est blessé, par miracle. La presse régionale s'en empare.`,e:{p:-8,r:-5,c:-3}}:{r:`La contre-expertise confirme le danger. Trois semaines ont été perdues.`,e:{p:-2}}}]},
 {id:'rave',l:'quartier',cond:()=>pop()<20000,t:'Une rave-party sauvage',x:`Samedi soir, deux mille personnes et un mur d'enceintes s'installent sans autorisation sur un terrain communal. Les gendarmes attendent vos consignes.`,ch:[
  {l:`Négocier une fin dimanche midi et le nettoyage du site`,e:{c:-1,p:-1},r:`Les basses s'arrêtent à midi dix. Le terrain est à peu près propre, les riverains épuisés.`},
  {l:`Sécuriser : secours, eau potable, circulation`,e:{m:-0.5,c:1,r:1},r:`Aucun blessé, aucun accident sur les routes. La préfecture salue la coordination.`},
  {l:`Exiger une intervention immédiate`,e:{p:1,r:-1},r:`Les forces de l'ordre jugent l'évacuation trop risquée de nuit. La fête dure jusqu'au lundi matin.`}]},
 {id:'voyageurs',l:'stade',cond:()=>pop()>5000,t:'Des caravanes sur le stade',x:`Une cinquantaine de caravanes se sont installées sur la pelouse du stade. La commune n'a toujours pas réalisé l'aire d'accueil prévue par le schéma départemental.`,ch:[
  {l:`Signer une convention de séjour de quinze jours`,e:{c:1,p:-1,m:-1},r:`Eau et électricité sont facturées, le départ a lieu à la date convenue. La pelouse est à refaire.`},
  {l:`Demander l'évacuation au préfet`,e:{p:1,r:-1},r:`Le préfet rappelle que la commune n'est pas en règle avec le schéma départemental. La demande n'aboutit pas.`},
  {l:`Lancer enfin la construction de l'aire d'accueil`,e:{m:-4,c:2,p:-2},r:`Le projet est voté. Les riverains du terrain choisi manifestent devant la mairie.`}]},
 {id:'cimetiere',l:'cimetiere',t:'Le cimetière est plein',x:`Il ne reste que trois emplacements libres au cimetière communal. {dgs} vous présente les options.`,ch:[
  {l:`Agrandir le cimetière sur le terrain voisin`,e:{m:-4,c:1,p:1},r:`L'extension est ouverte sans ruban, comme il se doit.`},
  {l:`Engager la reprise des concessions abandonnées`,e:{c:1,p:-1},r:`La procédure prendra plusieurs années. Quelques familles retrouvent une tombe qu'elles croyaient oubliée.`},
  {l:`Créer un columbarium et un jardin du souvenir`,e:{m:-1.5,c:1,p:1},r:`Le jardin du souvenir est planté de lavande. On s'y recueille volontiers.`}]},
 {id:'egalim',l:'ecole',t:'La cantine et la loi EGalim',x:`La loi EGalim impose à la restauration collective au moins 50 % de produits durables et de qualité, dont 20 % de bio. À la cantine {deVille}, on en est loin.`,ch:[
  {l:`Contractualiser avec les producteurs du coin`,e:{m:-1.5,c:3,a:1,p:1},r:`Les yaourts viennent de la ferme d'à côté, les légumes du maraîcher. Les enfants découvrent le panais.`},
  {l:`Passer par un prestataire certifié`,e:{m:-1,c:1},r:`Les objectifs sont atteints sur le papier. Le goût, lui, n'a pas beaucoup changé.`},
  {l:`Avancer à petits pas`,e:{c:-1,r:-1},r:`Une association de parents publie un comparatif des cantines du département. {ville} est en bas du tableau.`}]},
 {id:'sru',l:'prefecture',cond:()=>pop()>3500,t:'Les logements sociaux',x:`Le préfet constate que la commune n'atteint pas le taux de logements sociaux fixé par la loi SRU. Le prélèvement sur le budget communal va augmenter.`,ch:[
  {l:`Lancer un programme avec un bailleur social`,e:{m:-2,c:2,a:1,p:-1},r:`Quarante logements sont programmés. Les riverains du terrain choisi créent une association.`},
  {l:`Payer le prélèvement`,e:{m:-3},r:`La pénalité est réglée. {opp} demande à quoi l'argent aurait pu servir.`},
  {l:`Acheter des logements anciens pour les conventionner`,e:{m:-4,c:2},r:`Douze appartements du centre sont rachetés et rénovés.`}]},
 {id:'epicerie',l:'quartier',t:'Une épicerie solidaire',x:`Le centre communal d'action sociale constate une hausse des demandes d'aide alimentaire. Une association propose d'ouvrir une épicerie solidaire dans un local communal.`,ch:[
  {l:`Prêter le local et verser une subvention`,e:{m:-1,c:3,p:1},r:`L'épicerie ouvre trois après-midi par semaine. Les familles y paient une petite partie du prix habituel.`},
  {l:`Prêter le local seulement`,e:{c:1},r:`L'association se débrouille avec ses bénévoles.`},
  {l:`Refuser`,e:{c:-2,r:-1},r:`L'association s'installe dans la commune voisine.`}]},
 {id:'indice',l:'bureau',t:'Le point d’indice augmente',x:`Le gouvernement annonce une revalorisation du point d'indice des fonctionnaires. Pour la commune, la masse salariale augmente d'un coup.`,ch:[
  {l:`Absorber la hausse`,f:()=>{S.persMul*=1.03;return{e:{e:2}};},r:`Les agents apprécient. {dgs} refait le budget pour la troisième fois de la semaine.`},
  {l:`Geler deux recrutements prévus`,f:()=>{S.persMul*=1.01;return{e:{e:-2,c:-1}};},r:`Les services tiennent, en courant un peu plus.`},
  {l:`Augmenter les tarifs de la cantine et du centre de loisirs`,f:()=>{S.persMul*=1.03;S.tarifs=Math.min(2,S.tarifs+1);return{e:{p:-2}};},r:`Les familles reçoivent la nouvelle grille tarifaire avec la facture de septembre.`}]},
 {id:'energie',l:'bureau',t:'La facture d’énergie explose',x:`Au renouvellement du contrat, le fournisseur annonce une forte hausse du prix du gaz et de l'électricité pour les bâtiments communaux.`,ch:[
  {l:`Plan de sobriété : 19 °C dans les bâtiments et extinction nocturne`,f:()=>{S.enerMul*=1.25;return{e:{c:1,p:-1}};},r:`Les agents travaillent en pull. Les économies sont réelles.`},
  {l:`Rejoindre un groupement d'achat intercommunal`,f:()=>{S.enerMul*=1.2;return{e:{e:-1}};},r:`Le groupement négocie mieux. Il a fallu céder sur le calendrier.`},
  {l:`Payer la hausse`,f:()=>{S.enerMul*=1.6;return{};},r:`La ligne énergie du budget grimpe. {dgs} ne dit rien, son regard suffit.`}]},
 {id:'dotations',l:'prefecture',t:'Les dotations baissent',x:`La loi de finances réduit les concours de l'État aux collectivités. Pour {ville}, la dotation globale de fonctionnement recule.`,ch:[
  {l:`Faire voter une motion de protestation au conseil`,f:()=>{S.dotMul*=0.95;return{e:{p:1,r:1}};},r:`La motion est votée à l'unanimité, opposition comprise. L'État en prend note.`},
  {l:`Rejoindre la protestation des maires du département`,f:()=>{S.dotMul*=0.95;return{e:{r:2}};},r:`Vous êtes cité dans la presse nationale, une ligne en bas d'article.`},
  {l:`Chercher des économies sans bruit`,f:()=>{S.dotMul*=0.95;return{e:{m:1,e:-1}};},r:`{dgs} trouve des marges. L'équipe sent le budget se resserrer.`}]},
 {id:'cyber',l:'bureau',t:'Les ordinateurs sont bloqués',x:`Un lundi matin, tous les postes de la mairie affichent le même message : les fichiers sont chiffrés, une rançon est réclamée. L'état civil et la paie sont à l'arrêt.`,ch:[
  {l:`Refuser de payer, porter plainte, restaurer les sauvegardes`,f:()=>Math.random()<0.6?{r:`Les sauvegardes étaient à jour. Trois jours de panne, puis tout repart.`,e:{e:-1,r:1}}:{r:`Les sauvegardes étaient corrompues. Six semaines de reconstruction, des dossiers perdus.`,e:{m:-3,p:-2,e:-2}}},
  {l:`Faire appel à une entreprise spécialisée`,e:{m:-1.5,e:-1},r:`Les experts isolent le réseau et récupèrent l'essentiel en dix jours.`},
  {l:`Payer la rançon`,e:{m:-2,r:-4},f:()=>Math.random()<0.5?{r:`La clé de déchiffrement arrive. L'affaire fuite dans la presse quinze jours plus tard.`}:{r:`L'argent est parti, la clé n'arrive jamais.`,e:{p:-3}}}]},
 {id:'frelons',l:'quartier',t:'Les frelons asiatiques',x:`Les nids de frelons asiatiques se multiplient. Les apiculteurs perdent des ruches et la mairie reçoit un appel à chaque découverte.`,ch:[
  {l:`Prendre en charge la destruction des nids`,e:{m:-1,p:2,c:1},r:`Un numéro unique, une entreprise sous contrat. Quarante nids détruits dans l'été.`},
  {l:`Organiser un piégeage de printemps avec les apiculteurs`,e:{m:-0.3,c:1,e:1},r:`Les pièges sélectifs sont posés en mars. Les apiculteurs comptent moins de pertes.`},
  {l:`Laisser la charge aux propriétaires`,e:{p:-2},r:`Plusieurs nids restent en place tout l'été.`}]},
 {id:'tigre',l:'quartier',cond:()=>sud()&&mi()>=4&&mi()<=8,t:'Le moustique tigre',x:`Le moustique tigre est installé dans plusieurs quartiers. L'agence régionale de santé rappelle qu'il peut transmettre la dengue et demande de supprimer les eaux stagnantes.`,ch:[
  {l:`Campagne de porte-à-porte et distribution de conseils`,e:{m:-0.5,c:2,p:1},r:`Les soucoupes de pots de fleurs disparaissent des balcons. Les piqûres aussi, un peu.`},
  {l:`Traiter avaloirs et bâtiments communaux`,e:{m:-1,c:1},r:`Les agents traitent avaloirs et gouttières. Les résultats sont modestes mais réels.`},
  {l:`Renvoyer chacun à sa responsabilité`,e:{p:-1},r:`Les soirées en terrasse deviennent un sport de combat.`}]},
 {id:'depot',l:'quartier',t:'Un dépôt sauvage',x:`Un matelas, trois pneus et une baignoire ont été abandonnés à l'orée du bois. C'est la troisième fois ce mois-ci.`,ch:[
  {l:`Caméras de surveillance et amendes`,e:{m:-1,c:2},r:`Un artisan peu scrupuleux est identifié et verbalisé. La photo de la baignoire fait le tour du groupe Facebook.`},
  {l:`Collecte gratuite des encombrants sur rendez-vous`,e:{m:-1,c:2,p:1},r:`Le service est pris d'assaut. Les dépôts sauvages diminuent nettement.`},
  {l:`Nettoyer, une fois de plus`,e:{m:-0.3},r:`Les agents chargent le camion en soupirant.`}]},
 {id:'argiles',l:'quartier',cond:()=>['plaine','fleuve'].includes(geo()),t:'Les maisons se fissurent',x:`Après un été très sec, une quarantaine de propriétaires signalent des fissures. Le retrait-gonflement des argiles est en cause. Ils demandent que la commune sollicite la reconnaissance de l'état de catastrophe naturelle.`,ch:[
  {l:`Déposer la demande auprès de la préfecture`,e:{r:1},f:()=>Math.random()<0.4?{r:`L'arrêté de catastrophe naturelle paraît au Journal officiel. Les assurances devront indemniser.`,e:{p:4}}:{r:`La demande est rejetée, les critères n'étant pas remplis. La colère monte.`,e:{p:-2}}},
  {l:`Ouvrir une permanence avec des experts du bâtiment`,e:{m:-0.5,p:1,c:1},r:`Les propriétaires repartent avec des conseils et un dossier solide.`},
  {l:`Renvoyer vers les assureurs`,e:{p:-3},r:`Les sinistrés créent une association et vous invitent à leur première réunion.`}]},
 {id:'crue',l:'quartier',cond:()=>geo()==='fleuve'&&(mi()>=9||mi()<=3),t:'La {riv} sort de son lit',x:`Trois jours de pluie, et la {riv} déborde. Le quartier des berges a cinquante centimètres d'eau dans les rues.`,ch:[
  {l:`Déclencher le plan communal de sauvegarde et évacuer`,e:{m:-2,p:3,e:-1},r:`Cent vingt personnes sont évacuées, aucune victime. Le gymnase devient dortoir pour trois nuits.`},
  {l:`Mobiliser bénévoles et agents auprès des sinistrés`,e:{m:-1,p:2,e:1},r:`Pompes, sacs de sable, cafés chauds. La solidarité fait le reste.`},
  {l:`Attendre la décrue`,e:{p:-4},r:`L'eau repart au bout de deux jours. Les sinistrés, eux, n'oublient pas.`}]},
 {id:'feu',l:'quartier',cond:()=>(geo()==='foret'||sud())&&mi()>=5&&mi()<=8,t:'Le feu',x:`Un incendie s'est déclaré dans les bois au nord de la commune. Les pompiers demandent l'ouverture d'un centre d'accueil pour les habitants évacués.`,ch:[
  {l:`Ouvrir le gymnase et mobiliser tous les agents`,e:{m:-1,p:3,c:1},r:`Deux cents personnes accueillies, des lits de camp, des repas. Le feu est fixé le lendemain soir.`},
  {l:`Ouvrir le centre, puis contrôler le débroussaillement`,e:{m:-0.5,c:2,p:1},r:`Après le feu, les propriétaires reçoivent un courrier sur leurs obligations légales de débroussaillement.`},
  {l:`Laisser la préfecture organiser l'accueil`,e:{p:-3},r:`Les évacués sont envoyés à vingt kilomètres. On vous le reproche longtemps.`}]},
 {id:'dune',l:'littoral',cond:()=>geo()==='mer',t:'Le trait de côte recule',x:`Les tempêtes de l'hiver ont emporté plusieurs mètres de dune. Le poste de secours et six maisons du front de mer sont menacés.`,ch:[
  {l:`Construire un enrochement`,e:{m:-4,c:-1,p:2},r:`Les blocs de granit arrivent par camions. Les maisons sont protégées, la plage voisine recule plus vite.`},
  {l:`Préparer le recul des constructions les plus exposées`,e:{m:-2,c:3,p:-3},r:`Les propriétaires concernés sont furieux. Les scientifiques consultés approuvent.`},
  {l:`Poser des ganivelles et replanter la dune`,e:{m:-1,c:2},r:`Les palissades de châtaignier retiennent le sable. Les oyats reprennent au printemps.`}]},
 {id:'saisonniers',l:'littoral',cond:()=>geo()==='mer'&&mi()>=3&&mi()<=6,t:'Pas de saisonniers pour l’été',x:`Les restaurateurs du bord de mer n'arrivent pas à recruter : les saisonniers ne trouvent pas à se loger, les locations partant toutes aux touristes.`,ch:[
  {l:`Ouvrir un hébergement municipal pour saisonniers`,e:{m:-1.5,a:3,p:1},r:`L'ancienne colonie de vacances accueille quarante saisonniers. Les terrasses ouvrent à l'heure.`},
  {l:`Encadrer davantage les meublés de tourisme`,e:{a:1,c:2,p:-1},r:`Les loueurs saisonniers protestent. Quelques logements reviennent à l'année.`},
  {l:`Laisser le marché s'ajuster`,e:{a:-2},r:`Trois restaurants n'ouvrent que le week-end cet été.`}]},
 {id:'algues',l:'littoral',cond:()=>geo()==='mer'&&regn()==='Bretagne'&&mi()>=4&&mi()<=8,t:'Les algues vertes',x:`Des algues vertes s'échouent en masse sur la plage de la Grève. En se décomposant, elles dégagent de l'hydrogène sulfuré, un gaz toxique.`,ch:[
  {l:`Fermer la plage et ramasser chaque jour`,e:{m:-1,c:2,a:-1},r:`La plage reste fermée trois semaines. Personne n'est intoxiqué.`},
  {l:`Ramasser sans fermer`,e:{m:-0.5,a:1},f:()=>Math.random()<0.25?{r:`Un promeneur fait un malaise. La plage est fermée en urgence et l'affaire fait la une.`,e:{p:-4,r:-3}}:{r:`Le ramassage suit à peu près le rythme des marées.`}},
  {l:`Engager un travail de fond avec les agriculteurs du bassin versant`,e:{m:-1,c:2,e:-1},r:`Les réunions sont tendues mais se poursuivent. Les effets se mesureront en années.`}]},
 {id:'ski',l:'montagne',cond:()=>geo()==='montagne'&&(mi()>=10||mi()<=1),t:'La neige se fait attendre',x:`Les vacances de Noël approchent et la station n'a que vingt centimètres de neige. La régie des remontées mécaniques demande s'il faut investir dans de nouveaux enneigeurs.`,ch:[
  {l:`Investir dans la neige de culture`,e:{m:-4,a:2,c:-2},r:`Les pistes ouvrent pour Noël. La retenue d'eau creusée pour l'occasion fait débat.`},
  {l:`Développer les activités quatre saisons`,e:{m:-2,a:1,c:2},r:`VTT, randonnée, luge sur rail. La station vit aussi l'été.`},
  {l:`Attendre que la neige tombe`,e:{a:-2,p:-1},r:`Elle tombe le 4 janvier. Les vacances de Noël sont perdues.`}]},
 {id:'loup',l:'montagne',cond:()=>geo()==='montagne',t:'Le loup',x:`Trois attaques de loup en un mois sur les troupeaux des estives. Les éleveurs réclament des tirs, les associations de protection de la nature rappellent que l'espèce est protégée.`,ch:[
  {l:`Appuyer la demande des éleveurs auprès du préfet`,e:{p:2,c:-1},r:`Le préfet autorise des tirs de défense. Les associations annoncent un recours.`},
  {l:`Cofinancer chiens de protection et clôtures`,e:{m:-1,c:1,p:1},r:`Deux patous rejoignent les troupeaux. Les randonneurs apprennent à les contourner.`},

 {id:'methan',l:'quartier',cond:()=>geo()==='plaine',t:'Un méthaniseur',x:`Un groupement d'agriculteurs veut construire un méthaniseur à huit cents mètres des premières maisons, pour produire du gaz à partir des effluents d'élevage.`,ch:[

 {id:'frontaliers',l:'quartier',cond:()=>dep()==='Moselle',t:'Les loyers grimpent',x:`Attirés par les salaires du Luxembourg voisin, les travailleurs frontaliers s'installent nombreux. Les loyers flambent et les jeunes {deVille} ne trouvent plus à se loger.`,ch:[

 {id:'bus',l:'quartier',t:'La ligne de bus supprimée',x:`L'autorité organisatrice des transports annonce la suppression de la ligne qui relie {ville} à la gare la plus proche, faute de voyageurs.`,ch:[

  {l:`Monter un covoiturage solidaire avec des bénévoles`,e:{m:-0.3,c:1,e:1},r:`Vingt conducteurs bénévoles s'inscrivent. Le dispositif tient, fragile.`},
  {l:`Mobiliser les usagers`,e:{r:1},f:()=>Math.random()<0.35?{r:`La ligne est maintenue, avec deux allers-retours par jour au lieu de cinq.`,e:{p:2}}:{r:`La ligne est supprimée comme prévu.`,e:{p:-1}}}]},
 {id:'vitrines',l:'place',cond:()=>pop()>1500,t:'Les vitrines vides',x:`Une boutique sur cinq est vide dans la rue commerçante. Les propriétaires attendent un loyer que personne ne peut payer.`,ch:[

  {l:`Instaurer une taxe sur les friches commerciales`,e:{m:0.5,a:1,p:-1},r:`Plusieurs propriétaires baissent leurs loyers dans l'année.`},
  {l:`Ouvrir des boutiques éphémères pour les créateurs`,e:{m:-0.5,a:1,p:1},r:`La rue reprend des couleurs le temps d'une saison.`}]},
 {id:'salle2',l:'salle',t:'Deux associations, une salle',x:`Le club de judo et la troupe de théâtre réclament tous deux la salle polyvalente le mardi soir. Le ton monte entre les présidents.`,ch:[

  {l:`Donner la priorité au judo, qui compte plus d'adhérents`,e:{p:-1},r:`La troupe écrit une pièce sur un maire tyrannique. Elle fait salle comble.`},
  {l:`Aménager une seconde salle dans l'ancienne école`,e:{m:-2,p:2},r:`Chacun son mardi, et deux associations reconnaissantes.`}]},
 {id:'extension',l:'quartier',t:'Une extension sans permis',x:`Un riverain signale que son voisin, conseiller municipal de votre majorité, a construit une extension de quarante mètres carrés sans aucune autorisation d'urbanisme.`,ch:[

  {l:`Ne rien faire`,f:()=>Math.random()<0.5?{r:`Le riverain alerte la préfecture et la presse. On parle de favoritisme.`,e:{p:-4,r:-4}}:{r:`Le riverain finit par se lasser.`}}]},
 {id:'chaudiere',l:'ecole',cond:()=>S.bud.batiments<=0&&(mi()>=10||mi()<=2),t:'La chaudière de l’école lâche',x:`Un matin de froid, la chaudière de l'école {ecole} rend l'âme. Il fait douze degrés dans les classes.`,ch:[

  {l:`Des radiateurs électriques en attendant`,e:{m:-0.3,p:-2},r:`Les parents d'élèves envoient à {journal} des photos d'enfants en anorak.`}]},
 {id:'grevemun',l:'bureau',cond:()=>S.bud.personnel<0,t:'Les agents municipaux en grève',x:`Les syndicats dénoncent le manque d'effectifs depuis les coupes dans le budget du personnel. Les agents des services techniques et des écoles cessent le travail.`,ch:[

 {id:'cmj',l:'salle',joy:1,t:'Un conseil municipal des jeunes',x:`Des collégiens viennent vous proposer de créer un conseil municipal des jeunes, avec un vrai budget pour leurs projets.`,ch:[

 {id:'promotion',l:'stade',joy:1,t:'Le {club} monte',x:`Le {club} vient de décrocher la montée en division supérieure. Le président du club propose de fêter ça avec toute la ville.`,ch:[

  {l:`Un message de félicitations sur les réseaux`,e:{p:0.5},r:`Le message est aimé quatre cents fois. Les joueurs attendaient un peu plus.`}]},
 {id:'mariageblanc',l:'mariage',t:'Un mariage qui interroge',x:`L'officier d'état civil a des doutes sur la sincérité d'un mariage prévu samedi : les futurs époux ne parlent pas la même langue et se sont vus pour la première fois il y a trois semaines.`,ch:[

  {l:`Saisir directement le procureur`,e:{r:1},r:`Le procureur ordonne un sursis à la célébration, le temps de l'enquête.`},
  {l:`Célébrer comme prévu`,r:`Le mariage est célébré. Vous n'en saurez jamais plus.`}]},
 {id:'vitesse',l:'conseil',cond:()=>pop()>8000,t:'Trente kilomètres-heure',x:`Une association de parents demande de passer toute la ville à 30 km/h. Les commerçants et une partie des automobilistes y sont hostiles.`,ch:[

function nextWindow(){for(let d=S.day+1;d<S.day+400;d++){const x=dOf(d);if(x.getUTCDate()===1&&(x.getUTCMonth()===3||x.getUTCMonth()===9))return d;}return S.day+1;}
function fin(){
  const L={};let dep=0;
  LINES.forEach(([k,,b])=>{let v=b*(1+0.15*S.bud[k]);if(k==='personnel')v*=S.persMul;L[k]=v;dep+=v;});
  const ener=0.35*S.enerMul;dep+=ener;
  const rec={fisc:3.2*(1+0.15*S.taxe),dot:2.4*S.dotMul,tarifs:0.9*(1+0.2*S.tarifs),autres:2.0};
  const recT=rec.fisc+rec.dot+rec.tarifs+rec.autres;
  const annu=S.prets.reduce((s,p)=>s+p.mens,0), proj=S.projets.reduce((s,p)=>s+p.cout/p.duree,0);
  const dette=S.prets.reduce((s,p)=>s+p.cap,0);
  return {L,ener,dep,rec,recT,annu,proj,dette,epargne:recT-dep,net:recT-dep-annu-proj+S.recur+mods().cashMois};
}

function borrow(P){
  const F=fin(),r=0.035/12,n=240;
  if(F.epargne<=0||(F.dette+P)/(F.epargne*12)>12){toast('La banque refuse : la commune serait trop endettée.');return;}
  const mens=P*r/(1-Math.pow(1+r,-n));
  S.prets.push({cap:P,mens,reste:n});S.cash+=P*U();
  S.journal.unshift({day:S.day,titre:'Emprunt de '+fmtE(P*U()),txt:`Remboursé sur vingt ans, ${fmtE(mens*U())} par mois.`});
  save();render();toast('Emprunt signé');
}

function logoLines(nom){
  let parts=nom.split(/(?<=-)|\s+/).filter(Boolean);
  for(let k=0;k<parts.length-1;k++){if(parts[k].replace('-','').length<=3){parts[k]=parts[k]+(parts[k].endsWith('-')?'':' ')+parts[k+1];parts.splice(k+1,1);k--;}}
  while(parts.length>3){let bi=0,bl=1e9;for(let k=0;k<parts.length-1;k++){const l=parts[k].length+parts[k+1].length;if(l<bl){bl=l;bi=k;}}parts[bi]=parts[bi]+(parts[bi].endsWith('-')?'':' ')+parts[bi+1];parts.splice(bi+1,1);}
  return parts.map(p=>p.replace(/-$/,''));
}

function townSVG(v){
  const st=v.style, pop=v.pop, geo=v.geo, W=400, H=200, gy=170;
  const pal={granit:{wall:'#D8D4CC',roof:'#3E4650',pitch:1.0},colombage:{wall:'#F1E6CF',roof:'#8C3B2E',pitch:1.1,beams:1},brique:{wall:'#A4553F',roof:'#4E3B36',pitch:.7},tuile:{wall:'#E9CFA4',roof:'#C2643F',pitch:.35},ardoise:{wall:'#E7DFCC',roof:'#4B5563',pitch:.8},chalet:{wall:'#9A6A43',roof:'#5B4636',pitch:.55,wide:1}}[st];
  const tier=pop<2000?0:pop<15000?1:pop<80000?2:3;
  let bg='',mid='',fg='',k=0;
  const ink=(d,extra='')=>`<path class="ink" pathLength="1" style="--k:${k++}" d="${d}" ${extra}/>`;
  if(geo==='montagne')bg+=ink(`M0 ${gy-20} L60 60 L110 110 L170 40 L240 120 L300 70 L360 115 L400 90 V${gy} H0Z`,'class="ink hill"');
  if(geo==='mer')fg+=`<rect class="fillin" x="0" y="${gy}" width="${W}" height="${H-gy}" fill="#A5BCD6"/>`+ink(`M0 ${gy+8} q20-6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0`,'fill="none"');
  if(geo==='fleuve')fg+=ink(`M0 ${gy+18} C120 ${gy+4} 260 ${gy+30} 400 ${gy+12}`,'fill="none" stroke-width="8" style="stroke:#A5BCD6"');
  if(geo==='plaine'||geo==='foret')bg+=ink(`M0 ${gy-24} Q100 ${gy-50} 200 ${gy-30} T400 ${gy-34} V${gy} H0Z`,'class="ink hill"');
  // bâtiments
  const n=[7,10,12,13][tier]; const blds=[];
  for(let i=0;i<n;i++){
    const w=tier===0?26+RI(0,10):tier===1?28+RI(0,14):30+RI(0,16);
    let h=tier===0?28+RI(0,12):tier===1?36+RI(0,22):tier===2?44+RI(0,40):50+RI(0,70);
    blds.push({w,h});
  }
  let x=6;const total=blds.reduce((s,b)=>s+b.w+4,0);const sc=(W-12)/total;
  blds.forEach((b,i)=>{
    const w=b.w*sc,h=b.h, y=gy-h, rh=Math.min(28,w*pal.pitch*0.6)+(pal.wide?2:0);
    const cx=x+w/2;
    mid+=`<rect class="fillin" style="--k:${k}" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${h}" fill="${pal.wall}"/>`;
    mid+=ink(`M${x.toFixed(1)} ${gy} V${y} H${(x+w).toFixed(1)} V${gy}`,'fill="none"');
    if(tier<3||i%3){const ov=pal.wide?6:2;mid+=`<path class="fillin" style="--k:${k}" d="M${(x-ov).toFixed(1)} ${y} L${cx.toFixed(1)} ${(y-rh).toFixed(1)} L${(x+w+ov).toFixed(1)} ${y}Z" fill="${pal.roof}"/>`;}
    if(pal.beams)mid+=`<path class="fillin" style="--k:${k}" d="M${x.toFixed(1)} ${y+h/3} H${(x+w).toFixed(1)} M${(x+w/3).toFixed(1)} ${y} V${gy} M${(x+2*w/3).toFixed(1)} ${y} V${gy} M${x.toFixed(1)} ${y} L${(x+w/3).toFixed(1)} ${y+h/3}" stroke="#5a3a2a" stroke-width="2" fill="none"/>`;
    // fenêtres
    const cols=Math.max(1,Math.floor(w/11)),rows=Math.max(1,Math.floor((h-12)/14));
    for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){mid+=`<rect class="fillin" style="--k:${k}" x="${(x+4+c*(w-6)/cols).toFixed(1)}" y="${y+6+r*14}" width="4" height="6" fill="#231815" opacity=".55"/>`;}
    x+=w+4*sc;
  });
  // repères : clocher, mairie, arbres, tram
  const cx=W*0.42;
  mid+=`<rect class="fillin" style="--k:${k}" x="${cx-9}" y="${gy-(tier>1?96:80)}" width="18" height="${tier>1?96:80}" fill="${pal.wall}" stroke="#231815" stroke-width="1"/>`+ink(`M${cx-11} ${gy-(tier>1?96:80)} L${cx} ${gy-(tier>1?130:112)} L${cx+11} ${gy-(tier>1?96:80)}`,'fill="none"')+ink(`M${cx} ${gy-(tier>1?130:112)} V${gy-(tier>1?140:122)} M${cx-4} ${gy-(tier>1?136:118)} H${cx+4}`,'fill="none"');
  mid+=`<path class="fillin" style="--k:${k}" d="M${cx-11} ${gy-(tier>1?96:80)} L${cx} ${gy-(tier>1?130:112)} L${cx+11} ${gy-(tier>1?96:80)}Z" fill="${pal.roof}"/>`;
  if(st==='tuile'||geo==='plaine')for(let i=0;i<4;i++){const tx=30+i*100+RI(0,20);fg+=`<path class="fillin" style="--k:${k}" d="M${tx} ${gy} V${gy-20}" stroke="#4A2E27" stroke-width="3"/><circle class="fillin" style="--k:${k}" cx="${tx}" cy="${gy-28}" r="${st==='tuile'?12:10}" fill="#55634A"/>`;}
  if(tier===3)fg+=ink(`M0 ${gy-2} H400`,'fill="none" stroke-width="2"')+`<rect class="fillin" style="--k:${k}" x="250" y="${gy-14}" width="60" height="12" rx="4" fill="#A5BCD6" stroke="#231815"/>`;
  if(geo==='mer')fg+=`<path class="fillin" style="--k:${k}" d="M330 ${gy+16} l14-20 v20Z M300 ${gy+20} h40 l-6 6 h-30Z" fill="#4D0E12"/>`;
  return `<svg class="town" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dessin de la commune"><rect width="${W}" height="${H}" class="townsky"/>${bg}${mid}<rect x="0" y="${gy}" width="${W}" height="${H-gy}" class="townground"/>${fg}</svg>`;
}

   {l:`Signer`,e:{c:0.4,p:-0.1},r:`L'arrêté est affiché en mairie et publié.`},
   {l:`Le faire modifier avant signature`,e:{c:0.2,e:-0.1},r:`La version corrigée est signée la semaine suivante.`},
   {l:`Ne pas signer`,e:{c:-0.3},r:`Le projet d'arrêté retourne dans le parapheur.`}]};},
 question(){const q=pick(['le coût des fêtes municipales','l’état des routes communales','la sécurité aux abords du collège','le recrutement d’un nouveau cadre','le calendrier des travaux de l’école','la consommation énergétique des bâtiments']);
  return {l:'conseil',t:`Question de l’opposition`,x:`{opp} dépose une question écrite sur ${q} et réclame une réponse avant le prochain conseil.`,ch:[
   {l:`Répondre en détail, chiffres à l'appui`,e:{r:0.6,ro:3,e:-0.2},r:`{opp} reconnaît la qualité de la réponse, du bout des lèvres.`},
   {l:`Répondre en trois lignes`,e:{ro:-1},r:`{opp} dénonce un « mépris de l'opposition » dans {journal}.`},
   {l:`Répondre en séance publique`,e:{r:0.4,p:0.2,ro:-2},r:`L'échange est vif. Le public compte les points.`}]};},
 delib(){const d=pick([['la création d’un poste de policier municipal',{c:1,m:-1}],['l’adhésion à un groupement d’achat d’énergie',{m:1,e:0}],['la vente d’un terrain communal à un promoteur',{m:3,c:-1}],['la gratuité de la cantine pour les familles modestes',{c:2,m:-1.5,p:1}],['le changement de nom d’une rue',{p:0.5}],['un emprunt pour la rénovation des écoles',{c:1}],['la hausse des indemnités des élus',{p:-2,e:2}],['un jumelage avec une commune italienne',{a:1,m:-0.3}]]);
  return {l:'conseil',t:`Délibération : ${d[0]}`,x:`Le prochain conseil municipal doit se prononcer sur ${d[0]}. La majorité est-elle derrière vous ?`,vote:d[1],ch:[
   {l:`Inscrire le texte à l'ordre du jour et le faire voter`,vote:1},
   {l:`Retirer le texte pour en reparler`,e:{e:-0.3},r:`Le texte est retiré. L'opposition ironise sur vos hésitations.`}]};}

const POOL2=[
 {id:'fuite',l:'quartier',t:'Une canalisation cède',x:`Une conduite d'eau a cédé sous la {rue}. La chaussée est soulevée, quarante foyers n'ont plus d'eau depuis six heures du matin.`,ch:[
  {l:`Faire intervenir une entreprise en urgence, de nuit s'il le faut`,e:{m:-1.5,p:2,c:1},r:`L'eau revient à 21 heures. Les riverains applaudissent les ouvriers depuis les fenêtres.`},
  {l:`Distribuer des packs d'eau et réparer demain`,e:{m:-0.5,p:-1},r:`Les packs sont distribués devant la mairie. La réparation prend deux jours.`},

 {id:'brocante',l:'place',joy:1,t:'Une grande brocante',x:`Une association propose d'organiser une brocante géante dans tout le centre, un dimanche de printemps : quatre cents exposants attendus.`,ch:[

 {id:'champion',l:'stade',joy:1,t:'Un champion à la maison',x:`{pf} {nomR}, dix-neuf ans, licenciée au club d'athlétisme, vient de remporter le titre de championne de France junior du 400 mètres.`,ch:[
  {l:`Organiser une réception en mairie et une haie d'honneur`,e:{p:3,r:2,m:-0.3},r:`Toute l'école de son enfance est là. Elle signe des autographes sur des cahiers de brouillon.`},

 {id:'skatepark',l:'quartier',t:'Les jeunes veulent un skatepark',x:`Trente adolescents viennent au conseil municipal avec une pétition et une maquette en carton : ils veulent un skatepark.`,ch:[

 {id:'guirlandes',l:'place',t:'Les guirlandes volées',x:`Dans la nuit, quelqu'un a volé deux cents mètres de guirlandes lumineuses posées pour les fêtes. Les photos de la place éteinte circulent.`,ch:[
  {l:`Racheter des guirlandes et porter plainte`,e:{m:-0.8,p:1},r:`La place se rallume en trois jours. Le voleur reste introuvable.`},

 {id:'tempete',l:'quartier',t:'La tempête de la nuit',x:`Des rafales à plus de cent kilomètres-heure ont couché des arbres sur trois routes et arraché une partie de la toiture du gymnase.`,ch:[

 {id:'menaces',l:'presse',t:'Un adjoint menacé',x:`{adj} reçoit des menaces sur les réseaux sociaux après un vote sur l'urbanisme. Certains messages donnent son adresse.`,ch:[

 {id:'squat',l:'quartier',t:'Une maison squattée',x:`Une maison inoccupée de la {rue} est squattée depuis une semaine. Les voisins se plaignent de bruit et demandent une intervention.`,ch:[

 {id:'cinema',l:'place',t:'Le cinéma va fermer',x:`Le dernier cinéma de la commune, une salle de 1952, annonce sa fermeture : l'exploitant part à la retraite sans repreneur.`,ch:[

 {id:'cars',l:'ecole',t:'Le car scolaire supprimé',x:`La région supprime l'arrêt de car scolaire du hameau. Douze enfants n'ont plus de transport pour aller au collège.`,ch:[

 {id:'gendarmerie',l:'prefecture',cond:()=>pop()<20000,t:'La brigade de gendarmerie',x:`Le groupement de gendarmerie envisage de fermer la brigade de la commune et de la fusionner avec celle du canton voisin.`,ch:[

 {id:'eaupotable',l:'prefecture',t:'L’eau du robinet',x:`L'agence régionale de santé détecte des teneurs en nitrates proches du seuil autorisé dans l'eau du réseau communal. Les familles avec nourrissons s'inquiètent.`,ch:[

 {id:'eglise',l:'place',t:'L’église se fissure',x:`Un architecte du patrimoine constate des fissures inquiétantes dans le clocher de l'église, propriété de la commune. Il recommande d'interdire l'accès.`,ch:[

 {id:'cuivre',l:'chantier',t:'Vol de câbles',x:`Des voleurs ont arraché les câbles de cuivre de l'éclairage public sur deux kilomètres. Toute une zone est plongée dans le noir.`,ch:[

 {id:'celebrite',l:'mariage',joy:1,t:'Un mariage très médiatique',x:`Une actrice connue, dont la famille est originaire {deVille}, souhaite se marier à la mairie. Son agent demande la plus grande discrétion.`,ch:[
  {l:`Célébrer dans la discrétion la plus totale`,e:{p:1,r:1},r:`Le secret est gardé jusqu'au bout. La photo du balcon, publiée par les mariés eux-mêmes, fait le tour du pays.`},
  {l:`Prévenir {journal}`,e:{r:3,p:-1},r:`La presse est là. Les mariés ne vous adressent plus la parole.`},

 {id:'radar',l:'quartier',t:'Ça roule trop vite',x:`Les habitants de la {rue} demandent des ralentisseurs : les voitures y passent à plus de soixante-dix kilomètres-heure devant l'école.`,ch:[

 {id:'jardins',l:'quartier',joy:1,t:'Des jardins partagés',x:`Un collectif d'habitants propose de transformer un terrain communal en friche en jardins partagés, avec des parcelles pour les écoles.`,ch:[

 {id:'festival',l:'fete',joy:1,t:'Un festival de musique',x:`Un organisateur veut installer un festival de musiques actuelles sur trois jours, en juillet, dans un champ communal. Quinze mille festivaliers attendus.`,ch:[

 {id:'accident_agent',l:'chantier',t:'Un agent blessé',x:`Un agent des espaces verts s'est blessé avec une débroussailleuse. Il est hospitalisé, ses collègues dénoncent du matériel vétuste.`,ch:[

 {id:'stationnement',l:'conseil',cond:()=>pop()>8000,t:'Le stationnement payant',x:`{dgs} propose de rendre le stationnement payant en centre-ville pour favoriser la rotation des véhicules devant les commerces.`,ch:[

 {id:'accueil',l:'salle',joy:1,t:'La soirée des nouveaux habitants',x:`Plus de soixante familles se sont installées dans la commune cette année. Le comité des fêtes propose une soirée d'accueil.`,ch:[

  {l:`Envoyer un livret d'accueil`,e:{p:0.3},r:`Le livret est joli. Personne ne l'a lu.`}]},
 {id:'fetequartier',l:'quartier',joy:1,t:'La fête des voisins',x:`Les habitants du quartier {lotis} organisent une fête des voisins et vous invitent. Ils demandent des tables et des barrières.`,ch:[

 {id:'cambriolages',l:'quartier',t:'Une vague de cambriolages',x:`Sept cambriolages en deux semaines dans le quartier {lotis}. Une réunion publique tendue est prévue jeudi.`,ch:[

  {l:`Installer des caméras`,e:{m:-2.5,p:1},r:`Les caméras sont posées. {opp} dénonce une « dépense d'affichage ».`},

 {id:'bailleur',l:'quartier',cond:()=>pop()>3000,t:'Des logements dégradés',x:`Des locataires du bailleur social vous alertent : moisissures, ascenseur en panne depuis deux mois, chauffage aléatoire.`,ch:[

  {l:`Saisir le préfet`,e:{rf:1,c:1},r:`Un plan de travaux est imposé au bailleur.`},

function seatsAlloc(N,shares,winner){ // L.262 : moitié au vainqueur, reste à la proportionnelle (plus forte moyenne) entre listes ≥ 5 %
  const prime=N>4?Math.ceil(N/2):Math.floor(N/2);const seats=shares.map(()=>0);seats[winner]+=prime;
  const elig=shares.map((s,i)=>s>=5?i:-1).filter(i=>i>=0);let rest=N-prime;
  const base=elig.map(i=>({i,v:shares[i],s:0}));
  while(rest>0){let best=null,bv=-1;base.forEach(b=>{const q=b.v/(b.s+1);if(q>bv){bv=q;best=b;}});best.s++;rest--;}
  base.forEach(b=>seats[b.i]+=b.s);return seats;
}

const EVSCALE=0.21, MSCALE=0.15;
function applyE(e,scale=EVSCALE){
  const m=mods(),out={};
  for(const k in e){const v0=e[k];if(!v0)continue;
    if(k==='m'){const v=(v0<0?v0*m.coutMul:v0)*MSCALE;S.cash+=v*U();out.m=(out.m||0)+v;}
    else if(k==='eur'){S.cash+=v0;out.m=(out.m||0)+v0/U();}
    else if(k==='tx'){S.taxe=Math.max(-2,Math.min(3,S.taxe+v0));out.tx=v0;}
    else if(k==='en'){S.energie=clamp(S.energie+v0);out.en=v0;}
    else if(k==='fa'){S.famille=clamp(S.famille+v0);out.fa=v0;}
    else if(k==='ro'||k==='rp'||k==='rf'||k==='ra'){const key={ro:'opp',rp:'presse',rf:'prefet',ra:'assos'}[k];S.rel[key]=Math.max(-50,Math.min(50,S.rel[key]+v0));out[k]=v0;}
    else if(S.st[k]!==undefined){let v=v0*scale;if(k==='r'&&v>0)v*=m.presseMul;if(S.energie<25&&v>0)v*=0.6;const b=S.st[k];S.st[k]=clamp(S.st[k]+v);out[k]=S.st[k]-b;if(k==='r')S.rel.presse=Math.max(-50,Math.min(50,S.rel.presse+v0*0.8));}}
  return out;
}
